<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>mcx_purple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* 深色：夜讀 */
  :root {
    --bg: #17131d; --page: #1e1925; --panel: #221c2a; --panel-2: #2c2436; --line: #3a3046;
    --text: #e7e0ee; --muted: #9d92ab; --accent: #c3a3e6; --accent-ink: #1b1424;
    --accent-soft: rgba(195, 163, 230, .13); --danger: #e8909f;
    --accent-line: rgba(195, 163, 230, .42);
    --phone: #141018; --bubble-them: #2c2436; --bubble-me: #5b4378; --bubble-me-ink: #f4ecfb;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  /* 淺色：霧紫信紙 */
  :root[data-theme="light"] {
    --bg: #eeebf2; --page: #f9f7fb; --panel: #ffffff; --panel-2: #ebe5f1; --line: #ddd5e6;
    --text: #2e2638; --muted: #7d7189; --accent: #7a4e92; --accent-ink: #ffffff;
    --accent-soft: rgba(122, 78, 146, .10); --danger: #b04a5c;
    --accent-line: rgba(122, 78, 146, .32);
    --phone: #f1edf6; --bubble-them: #ffffff; --bubble-me: #7a4e92; --bubble-me-ink: #ffffff;
    --shadow: 0 10px 28px rgba(60, 40, 80, .12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #eeebf2; --page: #f9f7fb; --panel: #ffffff; --panel-2: #ebe5f1; --line: #ddd5e6;
      --text: #2e2638; --muted: #7d7189; --accent: #7a4e92; --accent-ink: #ffffff;
      --accent-soft: rgba(122, 78, 146, .10); --danger: #b04a5c;
    --accent-line: rgba(122, 78, 146, .32);
      --phone: #f1edf6; --bubble-them: #ffffff; --bubble-me: #7a4e92; --bubble-me-ink: #ffffff;
      --shadow: 0 10px 28px rgba(60, 40, 80, .12);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 6px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; flex: 1; min-width: 0; cursor: pointer; font-family: "Noto Serif TC", serif;
    font-size: 18px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 small { display: block; font-family: "Noto Sans TC", sans-serif; font-size: 11.5px; font-weight: 400;
    letter-spacing: 0; color: var(--muted); margin-top: 1px; }

  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 8px; white-space: nowrap; font-size: 14px; }
  button.ghost:hover { color: var(--text); }

  /* 閱讀區 */
  #chat { flex: 1; overflow-y: auto; padding: 24px 18px 32px; display: flex; flex-direction: column; gap: 22px; }
  #chat > * { width: 100%; max-width: 36em; margin-left: auto; margin-right: auto; }

  .page { font-family: "Noto Serif TC", "Songti TC", serif; font-size: 17px; line-height: 2.05;
    letter-spacing: .03em; color: var(--text); word-break: break-word; }
  .page p { margin: 0 0 1.15em; }
  .page p:last-child { margin-bottom: 0; }
  .page strong { font-weight: 600; }

  /* Markdown：標題、分隔線、清單、引用、表格、程式碼框 */
  .page h1, .page h2, .page h3, .page h4, .page h5, .page h6 { font-family: "Noto Sans TC", sans-serif; color: var(--accent);
    font-weight: 700; line-height: 1.6; letter-spacing: .04em; margin: 1.5em 0 .45em; }
  .page h1 { font-size: 1.3em; } .page h2 { font-size: 1.16em; } .page h3 { font-size: 1.04em; }
  .page h4, .page h5, .page h6 { font-size: .95em; }
  .page > :first-child { margin-top: 0; }
  .page hr { border: 0; border-top: 1px solid var(--line); width: 40%; margin: 1.7em auto; }
  .page em { font-style: normal; color: color-mix(in srgb, var(--text) 55%, var(--muted)); }
  .page ul, .page ol { margin: 0 0 1.15em; padding-left: 1.5em; }
  .page blockquote { margin: 0 0 1.15em; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent-line); color: var(--muted); }
  .page .tbl { overflow-x: auto; margin: 0 0 1.15em; }
  .page table { border-collapse: collapse; font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.7; letter-spacing: 0; }
  .page th, .page td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .page th { background: var(--panel-2); }
  .page code { font-family: inherit; background: var(--panel-2); border-radius: 5px; padding: 1px 5px; font-size: .9em; }
  .codecard { margin: 6px 0 1.4em; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .codecard pre { margin: 0; padding: 14px 16px 6px; font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.9;
    letter-spacing: .02em; white-space: pre-wrap; word-break: break-word; }
  .codecard pre code { background: none; padding: 0; font-size: inherit; }
  .codecard .bar { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 10px 10px; }
  .codecard .bar button { font-family: "Noto Sans TC", sans-serif; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; }

  /* 5.1 頁首 */
  .page .head { font-family: "Noto Sans TC", sans-serif; font-size: 12.5px; line-height: 1.9; letter-spacing: .04em;
    color: var(--muted); text-align: center; padding: 0 0 16px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }

  /* 玩家輸入：靠右的旁註 */
  .aside { align-self: flex-end; width: auto !important; max-width: min(85%, 30em) !important; margin-right: 0 !important;
    background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
    font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }

  /* 5.3 通訊：嵌在書頁裡的手機畫面（瀏海與 Home 條保留紫梓的 ✧✦ 符號） */
  .im { --app: var(--accent); font-family: "Noto Sans TC", sans-serif; letter-spacing: 0; line-height: 1.55;
    max-width: 22.5em; margin: 10px auto 28px; background: var(--phone); border: 1px solid var(--line);
    border-radius: 30px; padding: 0 0 8px; box-shadow: var(--shadow); overflow: hidden; }
  .im-notch { text-align: center; font-size: 11px; color: var(--accent); letter-spacing: 1px; padding: 9px 0 2px; opacity: .85; white-space: nowrap; overflow: hidden; }
  .im-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px 9px; border-bottom: 1px solid var(--line); }
  .im-bar .back { font-size: 22px; line-height: 1; color: var(--app); width: 14px; flex-shrink: 0; }
  .im-bar .ttl { flex: 1; min-width: 0; text-align: center; }
  .im-bar .who { font-size: 14.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-bar .sub { font-size: 11px; color: var(--muted); margin-top: 1px; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; }
  .im-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--app); display: inline-block; }
  .im-bar .more { color: var(--muted); font-size: 16px; width: 14px; flex-shrink: 0; text-align: right; }
  .im-day { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; margin: 2px 0 4px; }
  .im-msgs { display: flex; flex-direction: column; gap: 3px; padding: 10px 10px 6px; }
  .im-row { display: grid; grid-template-columns: 30px auto; column-gap: 7px; align-self: flex-start; max-width: 86%; margin-top: 7px; }
  .im-row.cont { margin-top: 0; }
  .im-row .ava { grid-row: 1 / span 2; width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); color: var(--accent);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .im-row.cont .ava { visibility: hidden; height: 0; }
  .im-row .name { font-size: 11px; color: var(--muted); margin: 0 4px 2px; }
  .im-row.cont .name { display: none; }
  .im-row .line { display: flex; align-items: flex-end; gap: 5px; }
  .im-row .bub { background: var(--bubble-them); border: 1px solid var(--line); border-radius: 4px 17px 17px 17px;
    padding: 7px 12px; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .im-row.cont .bub { border-radius: 17px; }
  .im-row .stamp { font-size: 10px; color: var(--muted); line-height: 1.3; white-space: nowrap; flex-shrink: 0; }
  .im-row.me { grid-template-columns: auto; align-self: flex-end; }
  .im-row.me .ava, .im-row.me .name { display: none; }
  .im-row.me .line { flex-direction: row-reverse; }
  .im-row.me .stamp { text-align: right; }
  .im-row.me .bub { background: var(--bubble-me); color: var(--bubble-me-ink); border-color: transparent; border-radius: 17px 4px 17px 17px; }
  .im-row.me.cont .bub { border-radius: 17px; }
  .im-row.sys { display: block; align-self: center; max-width: 92%; text-align: center; font-size: 11.5px; color: var(--muted); margin: 6px 0; }
  /* 媒體：照片、貼圖、語音、影片 */
  .im-row .bub.media { padding: 0; background: none; border: 0; }
  .im-media { display: flex; align-items: center; gap: 8px; border-radius: 14px; font-size: 13px; }
  .im-media.photo { width: 150px; height: 112px; justify-content: center; flex-direction: column; gap: 4px; color: var(--muted);
    background: linear-gradient(135deg, var(--panel-2), var(--accent-soft)); border: 1px solid var(--line); }
  .im-media.photo .ic { font-size: 26px; }
  .im-media.photo .cap { font-size: 11.5px; padding: 0 8px; text-align: center; }
  .im-media.sticker { font-size: 46px; line-height: 1; padding: 2px 4px; }
  .im-media.stk-card { flex-direction: column; align-items: flex-start; gap: 2px; max-width: 170px; padding: 9px 12px;
    border: 1.5px dashed var(--accent-line); background: var(--accent-soft); border-radius: 18px; }
  .im-media.stk-card .lab { font-size: 10.5px; color: var(--accent); letter-spacing: .05em; }
  .im-media.stk-card .txt { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .im-media.voice { padding: 8px 12px; background: var(--bubble-them); border: 1px solid var(--line); border-radius: 17px; }
  .im-row.me .im-media.voice { background: var(--bubble-me); color: var(--bubble-me-ink); border-color: transparent; }
  .im-media.voice .wave { letter-spacing: 1px; opacity: .8; }
  .im-chip { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .im-row.me .im-chip { background: rgba(255,255,255,.18); color: inherit; }
  /* 底部裝飾輸入列與 Home 條 */
  .im-input { display: flex; align-items: center; gap: 8px; margin: 4px 10px 0; padding: 6px 6px 6px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .im-input .box { flex: 1; background: var(--panel-2); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
  .im-input .send { width: 28px; height: 28px; border-radius: 50%; background: var(--app); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .im-home { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 1px; padding-top: 6px; opacity: .7; }

  /* 5.3 公開場合：直播、舞台、錄影、廣播 → 彈幕留言串 */
  .im.live .im-bar .live { font-size: 10.5px; font-weight: 700; color: #fff; background: #e5484d; border-radius: 4px; padding: 0 6px; }
  .im.live .im-bar .view { font-size: 11px; color: var(--muted); }
  .live-stage { margin: 10px 12px 4px; height: 70px; border-radius: 14px; background: linear-gradient(135deg, var(--accent-soft), var(--panel-2));
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; border: 1px solid var(--line); }
  .live-list { display: flex; flex-direction: column; gap: 5px; padding: 8px 14px 6px; font-size: 13.5px; }
  .live-list .c { line-height: 1.5; word-break: break-word; }
  .live-list .c b { font-weight: 700; margin-right: 6px; }
  .live-list .c.host { background: var(--accent-soft); border-radius: 10px; padding: 4px 8px; margin: 0 -8px; }
  .live-list .c.host .tag { font-size: 10px; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 5px; margin-right: 5px; }
  .live-list { --live-l: 64%; --gift: #e0ad4a; }
  :root[data-theme="light"] .live-list { --live-l: 38%; --gift: #9a6a12; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .live-list { --live-l: 38%; --gift: #9a6a12; } }
  .live-list .c.gift { color: var(--gift); }
  .live-list .c .t { font-size: 10px; color: var(--muted); margin-left: 6px; }


  /* 5.3 社群貼文 */
  .post-head { display: grid; grid-template-columns: 36px 1fr auto; gap: 9px; align-items: center; padding: 8px 14px 10px; border-bottom: 1px solid var(--line); }
  .post-head .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); color: var(--accent); font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .post-head .name { font-weight: 700; font-size: 14.5px; }
  .post-head .sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .post-head .dot, .call-top .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--app); display: inline-block; }
  .post-head .tags { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .post-tag { font-size: 11px; font-weight: 700; color: #e5484d; background: rgba(229, 72, 77, .14); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  /* 限動圈：一般＝平台色＋主題色漸層；限定＝綠圈＋右下星章（不分平台） */
  .im { --limited: #2fbf71; }
  :root[data-theme="light"] .im { --limited: #1f9d57; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .im { --limited: #1f9d57; } }
  .post-head.ringed { grid-template-columns: 42px 1fr auto; }
  .post-head .ring { position: relative; width: 42px; height: 42px; border-radius: 50%; padding: 2.5px; }
  .post-head .ring .ava { width: 100%; height: 100%; border: 2.5px solid var(--phone); }
  .post-head .ring.story { background: conic-gradient(from 210deg, var(--app), var(--accent), color-mix(in srgb, var(--app) 55%, #ffb36b), var(--app)); }
  .post-head .ring.limited { background: var(--limited); }
  .post-head .ring.limited::after { content: "★"; position: absolute; right: -3px; bottom: -3px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--limited); color: #fff; font-size: 9.5px; line-height: 1; display: flex; align-items: center; justify-content: center; border: 2px solid var(--phone); }
  .lim-tag { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--limited); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .post-body { padding: 10px 16px 4px; font-size: 14.5px; line-height: 1.75; }
  .post-body p { margin: 0 0 .7em; white-space: pre-wrap; word-break: break-word; }
  .post-body .hash { color: var(--accent); font-weight: 600; }
  .post-photos { margin: 2px 12px 8px; padding: 10px; border-radius: 16px; background: var(--panel-2); }
  .post-photos .cap { font-size: 12.5px; font-weight: 700; margin: 0 2px 8px; }
  .post-photos .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .post-photos .grid.one { grid-template-columns: 1fr; }
  .post-photos .ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
    min-height: 92px; padding: 8px; border-radius: 12px; background: linear-gradient(135deg, var(--panel), var(--accent-soft)); border: 1px solid var(--line); }
  .post-photos .ph .ic { font-size: 18px; opacity: .8; }
  .post-photos .ph b { font-size: 12.5px; }
  .post-photos .ph span:last-child { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .post-stats { padding: 6px 16px 8px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
  .post-comments { padding: 4px 16px 6px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.6; }
  .post-comments .cm b { margin-right: 6px; }
  .post-comments .cm .op { font-size: 10px; color: #fff; background: var(--app); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .post-comments .cm i { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 6px; }

  /* 5.3 通話中 */
  .im.call { background: linear-gradient(180deg, color-mix(in srgb, var(--app) 22%, var(--phone)), var(--phone) 55%); position: relative; }
  .im.call.video { background: linear-gradient(160deg, #2a2236, #120e18 70%); color: #f2ecf8; }
  .call-top { text-align: center; padding: 6px 14px 12px; }
  .call-top .sub { font-size: 11px; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 5px; }
  .call-top .ava.big { width: 74px; height: 74px; margin: 14px auto 8px; border-radius: 50%; background: var(--panel-2); color: var(--accent);
    font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent-line);
    box-shadow: 0 0 0 8px var(--accent-soft); }
  .call-top .who { font-size: 18px; font-weight: 700; }
  .call-top .state { font-size: 12.5px; color: var(--muted); margin-top: 2px; letter-spacing: .03em; }
  .im.call.video .call-top .sub, .im.call.video .call-top .state, .im.call.video .call-lines .ln b { color: #c9bdd8; }
  .pip { position: absolute; top: 46px; right: 14px; width: 62px; height: 86px; border-radius: 12px; background: #3b3150;
    border: 1px solid rgba(255,255,255,.25); color: #e8ddf5; font-size: 11px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .call-lines { display: flex; flex-direction: column; gap: 7px; padding: 4px 16px 10px; font-size: 14px; line-height: 1.6; }
  .call-lines .ln { align-self: flex-start; max-width: 88%; }
  .call-lines .ln b { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .call-lines .ln span { display: inline-block; background: color-mix(in srgb, var(--panel-2) 80%, transparent); border-radius: 12px; padding: 5px 11px; }
  .im.call.video .call-lines .ln span { background: rgba(0,0,0,.35); }
  .call-lines .ln.me { align-self: flex-end; text-align: right; }
  .call-lines .ln.me span { text-align: left; }
  .call-lines .ln.sys { align-self: center; font-size: 11.5px; color: var(--muted); }
  .call-ctl { display: flex; justify-content: space-around; padding: 10px 10px 4px; font-size: 10.5px; color: var(--muted); }
  .call-ctl span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .call-ctl i { font-style: normal; width: 42px; height: 42px; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--text); }
  .im.call.video .call-ctl i { background: rgba(255,255,255,.14); color: #fff; }
  .im.call .call-ctl .end i { background: #e5484d; color: #fff; transform: rotate(135deg); }

  /* 5.3 官方公告 → 公告卡 */
  .im.im-notice .notice-body { padding: 12px 16px 6px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
  .im.im-notice .notice-body .from { margin-top: 10px; text-align: right; font-size: 12px; color: var(--muted); }
  .im.im-notice .im-bar .badge { font-size: 10.5px; color: var(--app); border: 1px solid var(--app); border-radius: 4px; padding: 0 5px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
// ============================================================
// 設定：把這裡換成妳的 Worker 網址
// ============================================================
const WORKER_URL = "https://rp.mcxpurple.workers.dev";

// ☰ 選單的外部連結：換網址只改這三行
const CHARS_URL = "https://obvious-tenor-7aa.notion.site/210f4e50bb4b80008d28edd7fbe3da7c";  // 角色們（單人）
const WORLDS_URL = "https://obvious-tenor-7aa.notion.site/2d1f4e50bb4b802d9c80e60a76446428"; // 開放世界（多人）
const GUIDE_URL = "https://obvious-tenor-7aa.notion.site/3f5f4e50bb4b81e184d4eed446634734";  // 使用說明

// 每幾頁自動寫入記憶庫一次（實測時可暫時改小，例如 2）
const SAVE_EVERY = 20;
// 這一窗寫入記憶庫滿幾頁後，提示玩家換窗接續
const WINDOW_EVERY = 40;
// 每輪送出的最近對話則數，需與 Worker 的 HISTORY_LIMIT 相同（玩家＋角色各算一則，40 則約 20 頁）
const HISTORY_LIMIT = 40;

// ---------- 儲存（包 try/catch，私密瀏覽等情況下不會壞掉）----------
const store = {
  get(k, fallback) {
    try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch {} },
};

let settings = store.get("rp_settings", { invite: "", key: "", model: "", character: "", characterName: "", provider: "" });

// 服務商：依 key 開頭判斷（AIza → Gemini、sk-ant- → Claude、sk-or- → OpenRouter）
// 其他 sk- 開頭 ChatGPT 與 DeepSeek 共用，回傳 "sk"，由玩家自己選
const PROVIDERS = { gemini: "Gemini", claude: "Claude", openai: "ChatGPT", deepseek: "DeepSeek", openrouter: "OpenRouter" };
const SK_PROVIDERS = ["openai", "deepseek"];
function detectProvider(key) {
  const k = String(key || "").trim();
  if (k.startsWith("sk-ant-")) return "claude";
  if (k.startsWith("sk-or-")) return "openrouter";
  if (k.startsWith("AIza")) return "gemini";
  if (k.startsWith("sk-")) return "sk";
  return "";
}
// key 與服務商是否相符
function keyFits(key, provider) {
  const d = detectProvider(key);
  if (!d) return true;
  return d === "sk" ? SK_PROVIDERS.includes(provider) : d === provider;
}
// 舊版設定沒有服務商欄位：依 key 補上，判斷不出來就當 Gemini
if (!PROVIDERS[settings.provider]) {
  const d = detectProvider(settings.key);
  settings.provider = d === "sk" ? "openai" : d || "gemini";
  store.set("rp_settings", settings);
}
// 每個服務商各記一把 key 與上次用的模型：切換服務商時自動帶入，不用重貼
if (!settings.keys || typeof settings.keys !== "object") settings.keys = settings.key ? { [settings.provider]: settings.key } : {};
if (!settings.models || typeof settings.models !== "object") settings.models = settings.model ? { [settings.provider]: settings.model } : {};
store.set("rp_settings", settings);
// 存檔欄位：{ 角色id: { current: 存檔id, list: [{ id, name, card, updated, count }] } }
// 每個存檔的對話存在 rp_history_{角色id}__{存檔id}
let slots = store.get("rp_slots", {});
migrateOldData();

let history = [];
let busy = false;

const NEW_GAME = "/新玩家";
// 換窗、匯入記憶庫、從其他平台接續：第一句送 /舊玩家，附一行說明（畫面上不顯示）
const OLD_GAME = "/舊玩家";
const OLD_NOTE = "（角色卡與過往記憶已提供，請直接依記憶接續）";
const isOldGame = (t) => typeof t === "string" && t.startsWith(OLD_GAME);
const CARD_MARK = "【玩家角色卡】";

// 翻看指令清單（名稱、圖示、指令），由 Worker 的 /characters 提供，條目內容留在 Worker
let lorebook = store.get("rp_lore", []);
function setLore(list) {
  lorebook = Array.isArray(list) ? list : [];
  store.set("rp_lore", lorebook);
}
// 玩家輸入以指令開頭（後面接空白、換行或結尾）才算翻看
function loreOf(text) {
  const msg = String(text || "").trim();
  const low = msg.toLowerCase();
  for (const e of lorebook) {
    for (const k of e.keys || []) {
      const kl = k.toLowerCase();
      if (low === kl || (low.startsWith(kl) && /\s/.test(low.charAt(kl.length)))) {
        return { entry: e, rest: msg.slice(k.length).trim() };
      }
    }
  }
  return null;
}

// 舊版「一個角色一張卡、一段對話」→ 轉成各角色的「存檔 1」
function migrateOldData() {
  if (store.get("rp_slots_v", 0) >= 1) return;
  const oldCards = store.get("rp_cards", {});
  if (settings.card && settings.character && !oldCards[settings.character]) oldCards[settings.character] = settings.card;
  const ids = new Set(Object.keys(oldCards));
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const m = localStorage.key(i).match(/^rp_history_(.+)$/);
      if (m && !m[1].includes("__") && m[1] !== "none") ids.add(m[1]);
    }
  } catch {}
  for (const cid of ids) {
    if (slots[cid]) continue;
    const h = store.get(`rp_history_${cid}`, []);
    slots[cid] = { current: "s1", list: [{ id: "s1", name: "存檔 1", card: oldCards[cid] || "", updated: Date.now(), count: h.length }] };
    store.set(`rp_history_${cid}__s1`, h);
    store.remove(`rp_history_${cid}`);
  }
  store.set("rp_slots", slots);
  store.remove("rp_cards");
  store.remove("rp_history_none");
  delete settings.card;
  store.set("rp_settings", settings);
  store.set("rp_slots_v", 1);
}

function saveSlots() { store.set("rp_slots", slots); }
function charSlots(cid) { return slots[cid] || (slots[cid] = { current: "", list: [] }); }
function slotOf(cid) {
  const cs = slots[cid];
  return (cs && cs.list.find((s) => s.id === cs.current)) || null;
}
function curSlot() { return settings.character ? slotOf(settings.character) : null; }
function newSlot(cid, name) {
  const cs = charSlots(cid);
  const s = { id: Date.now().toString(36), name: name || `存檔 ${cs.list.length + 1}`, card: "", updated: Date.now(), count: 0 };
  cs.list.push(s);
  cs.current = s.id;
  saveSlots();
  return s;
}
// 角色沒有存檔時自動補一個，確保永遠有地方存
function ensureSlot(cid) {
  if (!cid) return null;
  const cs = charSlots(cid);
  if (!cs.list.some((s) => s.id === cs.current)) {
    if (cs.list.length) { cs.current = cs.list[0].id; saveSlots(); }
    else newSlot(cid);
  }
  return slotOf(cid);
}

function currentCard() { const s = curSlot(); return (s && s.card) || ""; }
function setCard(text) {
  const s = curSlot();
  if (!s) return;
  s.card = text || "";
  saveSlots();
}

const $ = (id) => document.getElementById(id);
const chatEl = $("chat");

function historyKey(cid = settings.character, sid) {
  if (sid === undefined) { const s = slotOf(cid); sid = s ? s.id : ""; }
  return `rp_history_${cid}__${sid}`;
}
function loadHistory() {
  const s = curSlot();
  history = s ? store.get(historyKey(), []) : [];
  if (!s) return;
  // 舊存檔沒有頁碼：依角色回覆順序補上，並校正頁首（不更動最後遊玩時間）
  const r = numberPages(history, s.base || 0);
  if (r.changed) store.set(historyKey(), history);
  if (s.pages !== r.pages) { s.pages = r.pages; saveSlots(); }
  // 舊存檔漏存角色卡：從對話紀錄補回
  if (!s.card) {
    const c = findCardInHistory(history);
    if (c) { s.card = c; saveSlots(); }
  }
}
function saveHistory() {
  const s = curSlot();
  if (!s) return;
  s.pages = numberPages(history, s.base || 0).pages;
  store.set(historyKey(), history);
  s.updated = Date.now();
  s.count = history.length;
  saveSlots();
}

// ---------- 頁數 ----------
// 一則角色回覆＝一頁；/新玩家 之後的第一則（登場）就是 page.1
// 重來最後一則：舊回覆移除後新回覆補回同一個位置，頁碼自然沿用
// base：換窗、匯入記憶庫或從其他平台接續時的起始頁（例如上一窗存到 Page.76，這裡就是 76）
function numberPages(list, base = 0) {
  let n = base, changed = false;
  for (const m of list) {
    if (m.role === "user" && m.text === NEW_GAME) n = 0;
    if (m.role !== "model") continue;
    n++;
    if (m.page !== n) { m.page = n; changed = true; }
    const fixed = fixHeadPage(m.text, n);
    if (fixed !== m.text) { m.text = fixed; changed = true; }
  }
  return { pages: n, changed };
}

// 把 5.1 頁首（開頭最多 3 行帶「｜」的行）裡的 page.X 改成程式計數；沒有 page 欄就原樣保留
function fixHeadPage(text, n) {
  if (typeof text !== "string") return text;
  const lines = text.split("\n");
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  for (let k = i; k < Math.min(i + 3, lines.length) && lines[k].includes("｜"); k++) {
    const re = /(page\s*[.．:：]?\s*)\d+/i;
    if (re.test(lines[k])) {
      lines[k] = lines[k].replace(re, `$1${n}`);
      return lines.join("\n");
    }
  }
  return text;
}

function slotPages(cid, s) {
  if (typeof s.pages === "number") return s.pages;
  return numberPages(store.get(historyKey(cid, s.id), []), s.base || 0).pages;
}

// ---------- 記憶庫：每個存檔各自保存記憶片段 ----------
// rp_memory_{角色id}__{存檔id} = { saved: 已寫入到第幾頁, epoch: 開新遊戲就 +1, frags: [{ from, to, date, text, at }] }
function memKey(cid, sid) { return `rp_memory_${cid}__${sid}`; }
function loadMem(cid = settings.character, sid = (curSlot() || {}).id) {
  const m = store.get(memKey(cid, sid), null);
  return m && Array.isArray(m.frags) ? m : { saved: 0, epoch: 0, frags: [] };
}
function saveMem(cid, sid, m) { store.set(memKey(cid, sid), m); }

const EVT_RE = /^\s*\[EVT\.(\d+)\s*[｜|]\s*([SABC])\s*\]\s*(.+?)\s*$/;
// 從記憶片段擷取 [EVT.xx｜權重] 事件標題（同一編號只取一次）
function fragEvts(text) {
  const seen = new Map();
  for (const l of String(text).split("\n")) {
    const m = l.match(EVT_RE);
    if (m && !seen.has(+m[1])) seen.set(+m[1], `[EVT.${m[1]}｜${m[2]}] ${m[3]}`);
  }
  return [...seen.entries()].sort((a, b) => a[0] - b[0]);
}
function fragLabel(f) {
  if (f.imported) return f.to ? `Page.1-${f.to}（其他平台匯入）` : "其他平台匯入";
  return `Page.${f.from}-${f.to}`;
}
function nextEvt(mem) {
  let max = 0;
  for (const f of mem.frags) for (const [n] of fragEvts(f.text)) max = Math.max(max, n);
  return max + 1;
}

// 常駐記憶檔由程式組裝：事件總目錄逐份累加＋最新片段的「當前狀態總結」到結尾
function buildMemory(mem, slotName = (curSlot() || {}).name || "") {
  if (!mem.frags.length) return "";
  const char = settings.characterName || "角色";
  const user = playerName() || "玩家";
  const out = [
    `【${char}×${user}｜${slotName}｜常駐記憶檔】`,
    `玩家名稱｜${user}｜記錄角色｜${char}`,
    "━ 事件總目錄 ━ # 權重：S=核心劇情 / A=重要事件 / B=一般過渡 / C=瑣碎細節",
  ];
  for (const f of mem.frags) {
    out.push(fragLabel(f) + `｜${f.date || ""}`);
    for (const [, t] of fragEvts(f.text)) out.push(t);
  }
  const last = mem.frags[mem.frags.length - 1].text;
  // 最新一份片段的情感記憶層（A-2 多角色時含每位角色的情感層），避免感情斷層
  const emo = emotionLayer(last);
  if (emo) out.push(emo);
  const i = last.indexOf("當前狀態總結");
  out.push(i >= 0 ? last.slice(i).trim() : last.trim());
  return out.join("\n");
}

// 情感層：從第一個「━…情感…━」標題，到「世界狀態層」標題之前
function emotionLayer(text) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  const a = lines.findIndex((l) => /^\s*━.*情感/.test(l));
  if (a < 0) return "";
  let b = lines.findIndex((l, k) => k > a && /世界狀態層/.test(l));
  if (b < 0) b = lines.findIndex((l, k) => k > a && /當前狀態總結/.test(l));
  return lines.slice(a, b < 0 ? lines.length : b).join("\n").trim();
}

// 換窗後第一輪：全部記憶片段依時間先後完整附上（之後改用 EVT 回查翻閱）
function allFragsText(mem) {
  if (!mem.frags.length) return "";
  const body = mem.frags.map((f) => `【${fragLabel(f)}｜記憶片段】\n${String(f.text).trim()}`).join("\n\n━━━━━━━━\n\n");
  return "以下為全部記憶片段，依時間先後排列；現況以常駐記憶檔為準，記憶片段保存事件細節與原話。\n\n" + body;
}

// 劇情日期區間：從這幾頁 5.1 頁首抓日期，例：2026.10.04 或 2026.10.04-10.05
function storyDates(list) {
  const ds = [];
  for (const m of list) {
    if (m.role !== "model") continue;
    const head = String(m.text).split("\n").slice(0, 4).join("\n");
    const d = head.match(/(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
    if (d) ds.push(`${d[1]}.${d[2].padStart(2, "0")}.${d[3].padStart(2, "0")}`);
  }
  if (!ds.length) return "";
  ds.sort();
  const a = ds[0], b = ds[ds.length - 1];
  return a === b ? a : a.slice(0, 4) === b.slice(0, 4) ? `${a}-${b.slice(5)}` : `${a}-${b}`;
}

// ---------- EVT 回查 ----------
// 把全部記憶片段的事件逐筆建索引：編號、權重、標題、完整內容、關鍵詞、相關事件、頁數
function evtIndex(mem) {
  const map = new Map();
  for (const f of mem.frags) {
    const lines = String(f.text).replace(/\r/g, "").split("\n");
    let cur = null;
    const close = () => {
      if (!cur) return;
      const body = cur.lines.join("\n").replace(/\s+$/, "");
      const kw = (body.match(/關鍵詞[:：]\s*(.+)/) || [])[1] || "";
      const rel = (body.match(/相關事件[:：]\s*(.*)/) || [])[1] || "";
      const pg = body.match(/\(P\.?\s*(\d+)(?:\s*[-–~～]\s*P?\.?\s*(\d+))?\)/);
      const evt = {
        num: cur.num,
        head: cur.head,
        body,
        keys: kw.split(/[,，、;；]/).map((s) => s.trim()).filter((s) => s.length >= 2),
        related: [...rel.matchAll(/EVT\.?\s*(\d+)/gi)].map((m) => +m[1]),
        pageTo: pg ? +(pg[2] || pg[1]) : f.to || 0,
      };
      const old = map.get(evt.num);
      if (!old || evt.body.length > old.body.length) map.set(evt.num, evt);
      cur = null;
    };
    for (const l of lines) {
      const m = l.match(EVT_RE);
      if (m) { close(); cur = { num: +m[1], head: `[EVT.${m[1]}｜${m[2]}] ${m[3]}`, lines: [l.trim()] }; continue; }
      if (cur && (/^\s*(當前狀態總結|━)/.test(l) || /^\s*\(事件多時/.test(l))) { close(); continue; }
      if (cur) cur.lines.push(l);
    }
    close();
  }
  return map;
}

// 比對玩家這一句＋角色上一則，命中關鍵詞或直接寫 EVT 編號；再順著「相關事件」一路帶出去
// 還在這次送出的對話紀錄裡的事件不重複附（但仍會順著它的相關事件往前找）
function recallText(mem, message, lastReply, windowStart) {
  const idx = evtIndex(mem);
  if (!idx.size) return "";
  const src = `${message}\n${lastReply}`.toLowerCase();
  const hit = new Set();
  for (const e of idx.values()) {
    if (e.keys.some((k) => src.includes(k.toLowerCase()))) hit.add(e.num);
  }
  for (const m of src.matchAll(/evt\.?\s*(\d+)/g)) if (idx.has(+m[1])) hit.add(+m[1]);
  const all = new Set();
  const walk = (n) => {
    if (all.has(n) || !idx.has(n)) return;
    all.add(n);
    for (const r of idx.get(n).related) walk(r);
  };
  hit.forEach(walk);
  const picked = [...all]
    .sort((a, b) => a - b)
    .map((n) => idx.get(n))
    .filter((e) => !(windowStart && e.pageTo >= windowStart));
  if (!picked.length) return "";
  return "以下為本輪提及之過往事件與其相關事件，供承接因果與原話；現況以常駐記憶檔為準。\n\n" + picked.map((e) => e.body).join("\n\n");
}

// 取出 Page.from-to 的對話原文（含引出第一頁的那句玩家訊息）
function sliceTranscript(list, from, to) {
  const idx = [];
  list.forEach((m, i) => { if (m.role === "model" && m.page >= from && m.page <= to) idx.push(i); });
  if (!idx.length) return [];
  let a = idx[0];
  if (a > 0 && list[a - 1].role === "user") a--;
  return list
    .slice(a, idx[idx.length - 1] + 1)
    .filter((m) => !(m.role === "user" && m.text === NEW_GAME))
    .map(({ role, text, page }) => ({ role, text, page }));
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

// ---------- 把角色回覆排成小說頁 ----------
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 只處理粗體、刪除線與連結，其餘一律當純文字
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// Markdown：正文交給 marked（cdnjs）；回覆夾帶的 HTML 一律當文字顯示，連結只放行 http(s)，圖片只顯示說明文字
// marked 沒載入時退回 inline() 的簡易版
const md = window.marked && window.marked.Marked ? new window.marked.Marked({ gfm: true, breaks: true }) : null;
if (md) {
  md.use({
    renderer: {
      html(h) { return esc(typeof h === "string" ? h : (h && h.text) || ""); },
      link(href, title, text) {
        return /^https?:\/\//i.test(href || "") ? `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>` : text;
      },
      image(href, title, text) { return esc(text || ""); },
    },
  });
}

function renderMarkdown(text, page) {
  if (!text.trim()) return;
  if (!md) {
    text.split(/\n\s*\n/).forEach((chunk) => {
      if (!chunk.trim()) return;
      const p = document.createElement("p");
      p.innerHTML = chunk.split("\n").map((l) => inline(l.trim())).join("<br>");
      page.append(p);
    });
    return;
  }
  const box = document.createElement("div");
  box.innerHTML = md.parse(text);
  // 表格可左右捲動
  box.querySelectorAll("table").forEach((t) => {
    const w = document.createElement("div");
    w.className = "tbl";
    t.replaceWith(w);
    w.append(t);
  });
  // 程式碼框（例如 ```text 包住的角色卡）：加「填入」「複製」
  box.querySelectorAll("pre").forEach((pre) => {
    const code = pre.textContent.replace(/\n$/, "");
    const card = document.createElement("div");
    card.className = "codecard";
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("button");
    fill.type = "button";
    fill.textContent = "填入";
    fill.onclick = () => {
      const inp = $("input");
      inp.value = code;
      autoGrow();
      inp.focus();
    };
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "複製";
    copy.onclick = async () => {
      await copyText(code);
      copy.textContent = "已複製";
      setTimeout(() => (copy.textContent = "複製"), 1500);
    };
    bar.append(fill, copy);
    pre.replaceWith(card);
    card.append(pre, bar);
  });
  page.append(...box.childNodes);
}

// 從玩家角色卡讀出名字，不限寫法：
//   標籤（名字／姓名／名稱／Name）→ 自我介紹句（我叫／我是／叫我）→ 第一段第一格 → 記憶片段裡的「玩家名稱」
function playerName(card = currentCard()) {
  const SEP = /[｜|│┃丨／\/,，、;；。\n]/;
  const clean = (x) =>
    x.replace(/（.*?）|\(.*?\)|「|」|『|』|\*\*/g, "").replace(/^[\s\-•*・◦#>：:｜|＝=]+/, "").replace(/(就好|就可以|就行|吧|喔|哦|啦)$/, "").trim();
  const ok = (x) => (x && x.length <= 12 && !/^(性別|年齡|生日|身高|外貌|職業|女|男)$/.test(x) ? x : "");
  if (card) {
    card = card.replace(/\*\*/g, "");
    // 1. 標籤
    const m = card.match(/(?:名字|姓名|名稱|稱呼|name)\s*(?:是|叫|為)?\s*[：:｜|＝=]?\s*([^\n]+)/i);
    if (m) { const v = ok(clean(m[1].split(SEP)[0])); if (v) return v; }
    // 2. 自我介紹句
    const intro = card.match(/(?:我叫|我是|叫我|名叫|本名)\s*([^\s，,。.、｜|：:！!？?（(\n]{1,12})/);
    if (intro) { const v = ok(clean(intro[1])); if (v) return v; }
    // 3. 「玩家角色卡」標題之後（沒有標題就從頭）第一段的第一格
    const h = card.match(/【?玩家角色卡】?\s*[：:]?/);
    const rest = h ? card.slice(h.index + h[0].length) : card;
    const first = rest.split("\n").map((l) => l.trim()).find(Boolean) || "";
    const v = ok(clean(first.split(SEP)[0]));
    if (v) return v;
  }
  // 4. 記憶片段裡模型寫下的玩家名稱
  try {
    const frags = curSlot() ? loadMem().frags : [];
    for (let i = frags.length - 1; i >= 0; i--) {
      const t = String(frags[i].text);
      const a = t.match(/玩家名稱｜([^｜\n]+)/);
      if (a && a[1].trim() && a[1].trim() !== "玩家") return a[1].trim();
      const b = t.match(/玩家（([^）]{1,12})）/);
      if (b) return b[1].trim();
    }
  } catch {}
  return "";
}

// 玩家在聊天中送出的是不是角色卡：開頭是「玩家角色卡」，而且後面有分隔或換行
// 角色剛請玩家填角色卡（上一則提到「角色卡」），且這個存檔還沒有卡：玩家接著送出的那一則就是角色卡，不論格式
function isCardReply(msg, prevModelText) {
  const t = String(msg || "").trim();
  return !currentCard() && /角色卡/.test(prevModelText || "") && !t.startsWith("/") && t.length >= 8;
}
// 舊存檔補救：從對話紀錄找出「角色請填卡 → 玩家回覆」的那一則
function findCardInHistory(list) {
  for (let i = 1; i < list.length; i++) {
    const m = list[i];
    if (m.role !== "user" || m.text.startsWith("/")) continue;
    if (m.text.includes(CARD_MARK) || isCardMessage(m.text)) return m.text;
    const prev = list[i - 1];
    if (prev.role === "model" && /角色卡/.test(prev.text) && m.text.trim().length >= 8) return m.text;
  }
  return "";
}

function isCardMessage(msg) {
  return /^\s*【?玩家角色卡】?\s*[：:]?[\s\S]*[｜|\n]/.test(msg) && /^\s*【?玩家角色卡/.test(msg);
}

// 小幫手的裝飾框線（◆‧₊˚ … ◆）與單純分隔線（*** 或 ---）
function isFrameLine(l) { return /^\s*[◆◇]/.test(l) || isRuleLine(l); }
function isRuleLine(l) { return /^\s*(\*{3,}|-{3,}|＊{3,})\s*$/.test(l); }

// 結尾記號比對：去掉空白與變體符號後取開頭（與 Worker 的 tailKey 相同規則）
function tailKey(line) {
  return String(line).split("{")[0].replace(/[\s️]/g, "");
}
const tailMarks = store.get("rp_tail", {});

function isTrackerLine(l) {
  return /｜/.test(l) || /^\s*(·|⊱|✦|🧨|㊙️)/.test(l) || /行動建議/.test(l);
}

function renderPage(text, latest) {
  const page = document.createElement("article");
  page.className = "page";
  const lines = text.replace(/\r/g, "").split("\n");

  let start = 0;
  while (start < lines.length && !lines[start].trim()) start++;

  // 5.1 頁首：開頭連續幾行帶「｜」、且其中一行有 page
  let headEnd = start;
  while (headEnd < lines.length && headEnd - start < 3 && lines[headEnd].includes("｜")) headEnd++;
  const headLines = lines.slice(start, headEnd);
  if (headLines.length >= 2 && headLines.some((l) => /page/i.test(l))) {
    const h = document.createElement("div");
    h.className = "head";
    h.innerHTML = headLines.map((l) => inline(l.trim())).join("<br>");
    page.append(h);
    start = headEnd;
  }

  // 5.2 狀態欄：先用後台的結尾記號（Worker 從最後一個「格式如下」算出來）
  // 從上往下找第一個同樣開頭、而且從那行到結尾都沒有長段落（不含「｜」超過 60 字＝正文）的行，從那行收起
  let end = lines.length;
  const mark = tailMarks[settings.character] || "";
  const isProse = (l) => !l.includes("｜") && [...l.trim()].length > 60;
  let m = -1;
  if (mark) {
    for (let i = start; i < lines.length; i++) {
      if (tailKey(lines[i]).startsWith(mark) && !lines.slice(i).some(isProse)) { m = i; break; }
    }
  }
  if (m >= 0) {
    // 整頁都是結算格式（例如深夜存檔頁）→ 不收合，整頁照常顯示
    if (lines.slice(start, m).some((l) => l.trim())) end = m;
  } else {
    let j = lines.length - 1;
    while (j >= start && (!lines[j].trim() || isTrackerLine(lines[j]))) j--;
    const tail = lines.slice(j + 1);
    if (tail.some((l) => l.includes("｜"))) end = j + 1;

    // 5.2 的小幫手區塊（◆ 框線包起來，或 *** 分隔線之後）緊接在狀態行前面時，一起收進狀態
    if (end < lines.length) {
      let k = end - 1;
      while (k >= start && !lines[k].trim()) k--;
      if (k >= start && isFrameLine(lines[k])) {
        if (isRuleLine(lines[k])) end = k;
        else {
          let o = k - 1;
          while (o >= start && !isFrameLine(lines[o])) o--;
          end = o >= start && !isRuleLine(lines[o]) ? o : k;
        }
      }
    }
  }

  // 中間：小說正文（Markdown）、5.3 通訊、5.4 音樂卡、翻看卡
  let buf = [];
  let fence = false;
  const flush = () => {
    renderMarkdown(buf.join("\n"), page);
    buf = [];
  };

  for (let i = start; i < end; i++) {
    const l = lines[i];
    const t = l.trim();
    // 程式碼框裡的內容原樣保留，不判斷其他格式
    if (/^(```|~~~)/.test(t)) { fence = !fence; buf.push(t); continue; }
    if (fence) { buf.push(l); continue; }
    if (t.startsWith("✧✦")) {
      flush();
      const block = [];
      i++;
      while (i < end && !lines[i].trim().startsWith("✧✦")) block.push(lines[i++]);
      page.append(renderIM(block));
    } else if (t.startsWith("╭")) {
      flush();
      const block = [];
      i++;
      while (i < end && !lines[i].trim().startsWith("╰")) block.push(lines[i++]);
      page.append(renderSong(block));
    } else if (isLoreSep(t)) {
      // 翻看卡：第一條到最後一條「✦ ─」分隔線之間
      flush();
      let last = i;
      for (let k = i + 1; k < end; k++) if (isLoreSep(lines[k].trim())) last = k;
      const stop = loreCommentsEnd(lines, last + 1, end);
      page.append(renderLoreCard(lines.slice(i, stop)));
      i = stop - 1;
    } else if (isRuleLine(t)) {
      // 分隔線前面補空行，避免上一行被當成標題
      buf.push("", "---", "");
    } else {
      // 去掉行首空白：避免縮排被當成程式碼框
      buf.push(t);
    }
  }
  if (fence) buf.push("```");
  flush();

  // 5.2 狀態欄：整理成可收合的狀態卡（翻看也收在卡片裡）；沒有狀態欄的頁面，翻看照舊放在最下面
  if (end < lines.length) page.append(renderStatus(lines.slice(end), latest));
  else if (latest && lorebook.length) page.append(renderPeek());
  return page;
}

// ---------- 5.2 狀態卡 ----------
// 不看各角色的 emoji 對照，只看行的形狀：
//   emoji｜名字｜內容 → 依名字收成人物卡（名字是玩家的放「玩家」）
//   emoji｜內容 → 劇情節點
//   有 HH:MM–HH:MM 的行 → 行程
//   ╓…╙、┏…┗、◆…◆ 框起來的區塊 → 系統小幫手（①②③ 選項可點，點了填進輸入框）
//   純裝飾的分隔線略過；認不出來的行原樣放在最下面
const ST_TIME = /\d{1,2}[:：]\d{2}\s*[-–—~～]\s*\d{1,2}[:：]\d{2}/;
const ST_OPEN = /^[╓┏╔┌╭]/;
const ST_CLOSE = /^[╙┗╚└╰]/;
const ST_DIAMOND = /^[◆◇]/;
const ST_OPTION = /[①②③④⑤❶❷❸❹❺]/;
const isIcon = (x) => !!x && [...x].length <= 4 && !/[\p{L}\p{N}]/u.test(x.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, ""));
function stTitle(l) {
  return l.replace(/^[\s╓╖╙╜┏┓┗┛╔╗╚╝┌┐└┘╭╮╰╯─━═◈◆◇·•‧₊˚⋆✦✧◦]+|[\s╓╖╙╜┏┓┗┛╔╗╚╝┌┐└┘╭╮╰╯─━═◈◆◇·•‧₊˚⋆✦✧◦]+$/g, "").trim();
}
function stCells(l) { return l.split(/[｜|]/).map((x) => x.trim()); }

function parseStatus(lines) {
  const out = { people: [], player: [], nodes: [], groups: [], helpers: [], misc: [] };
  // 行程分組：每遇到一個行程標題（例：㊙️ 駱懷柏 機密行程雷達）開新的一組；沒有標題的放進「行程」
  let group = null;
  const addSched = (l) => { if (!group) { group = { title: "", items: [] }; out.groups.push(group); } group.items.push(stSched(l)); };
  const newGroup = (title) => { group = { title, items: [] }; out.groups.push(group); };
  const me = playerName();
  const person = (name) => {
    let p = out.people.find((x) => imSame(x.name, name));
    if (!p) { p = { name, rows: [] }; out.people.push(p); }
    return p;
  };
  const list = lines.map((l) => l.replace(/\r/g, ""));
  for (let i = 0; i < list.length; i++) {
    const raw = list[i];
    const t = raw.trim();
    if (!t || isRuleLine(t)) continue;
    // 系統小幫手：框線區塊
    if (ST_OPEN.test(t) || ST_DIAMOND.test(t)) {
      const diamond = ST_DIAMOND.test(t);
      const h = { title: stTitle(t), lines: [], options: [] };
      let j = i + 1;
      for (; j < list.length; j++) {
        const u = list[j].trim();
        if (diamond ? ST_DIAMOND.test(u) : ST_CLOSE.test(u)) break;
        if (!u) continue;
        if (ST_TIME.test(u)) { addSched(u); continue; }
        if (ST_OPTION.test(u)) {
          // 選項前那句引言（例：知煙為你擺開三條路）跟著選項走
          if (!h.options.length && h.lines.length && !h.lines[h.lines.length - 1].includes("｜")) h.optLabel = h.lines.pop();
          h.options.push(u);
          continue;
        }
        // 行程前的小標題（例：㊙️ 駱懷鎮 機密行程雷達）移到行程區
        const nx = (list.slice(j + 1).find((x) => x.trim()) || "").trim();
        if (!u.includes("｜") && [...u].length <= 24 && ST_TIME.test(nx)) { newGroup(u); continue; }
        h.lines.push(u);
      }
      // 結尾框線上若有文字（例：◆‧₊ 小幫手名 ◆）也當標題
      if (!h.title && j < list.length) h.title = stTitle(list[j]);
      out.helpers.push(h);
      i = j;
      continue;
    }
    if (!/[\p{L}\p{N}]/u.test(t)) continue; // 純裝飾分隔線
    if (ST_TIME.test(t)) { addSched(t); continue; }
    const c = stCells(t);
    if (c.length >= 3 && isIcon(c[0]) && c[1] && [...c[1]].length <= 12) {
      const row = { icon: c[0], text: c.slice(2).join("｜") };
      if (me && imSame(c[1], me)) out.player.push(row);
      else person(c[1]).rows.push(row);
      continue;
    }
    if (c.length === 2 && isIcon(c[0])) { out.nodes.push({ icon: c[0], text: c[1] }); continue; }
    // 行程前的小標題（例：🥏 樊翼祁 星盤行運追蹤）
    const next = (list.slice(i + 1).find((x) => x.trim()) || "").trim();
    if (!t.includes("｜") && [...t].length <= 24 && ST_TIME.test(next)) { newGroup(t); continue; }
    out.misc.push(t);
  }
  // 行程內容裡出現人物名字的格子，標成小標籤（多人行程看得出是誰的）
  const names = out.people.map((p) => p.name).concat(me ? [me] : []);
  out.groups = out.groups.filter((g) => g.items.length);
  for (const g of out.groups) for (const it of g.items) {
    const k = it.text.findIndex((x) => names.some((n) => imSame(x, n)) && [...x].length <= 12);
    if (k >= 0) it.who = it.text.splice(k, 1)[0];
  }
  return out;
}

function stSched(l) {
  const c = stCells(l);
  const ti = c.findIndex((x) => ST_TIME.test(x));
  const item = { time: c[ti] || "", place: "", text: [], note: "" };
  c.forEach((x, k) => {
    if (k === ti || !x) return;
    if (/^📍/.test(x) && !item.place) item.place = x.replace(/^📍\s*/, "");
    else if (/^🫖|^💭|^（.*）$/.test(x)) item.note = x;
    else item.text.push(x);
  });
  return item;
}

function stSection(label, body) {
  const sec = document.createElement("div");
  sec.className = "st-sec";
  const h = document.createElement("div");
  h.className = "st-lab";
  h.textContent = label;
  sec.append(h, body);
  return sec;
}
function stRows(rows) {
  const box = document.createElement("div");
  box.className = "st-rows";
  for (const r of rows) {
    const d = document.createElement("div");
    d.className = "st-row";
    d.innerHTML = `<span class="ic">${esc(r.icon)}</span><span>${inline(r.text)}</span>`;
    box.append(d);
  }
  return box;
}
function fillInput(text) {
  const inp = $("input");
  inp.value = text;
  autoGrow();
  inp.focus();
}

// 記住玩家的展開習慣：打開過的區塊，下一頁自動打開（只存在這支手機）
const foldMem = store.get("rp_fold", {});
function foldable(d, key, def) {
  d.open = key in foldMem ? !!foldMem[key] : def;
  const sum = d.querySelector("summary");
  if (sum) sum.addEventListener("click", () => { foldMem[key] = !d.open; store.set("rp_fold", foldMem); });
}

function renderStatus(lines, latest) {
  const st = parseStatus(lines);
  const det = document.createElement("details");
  det.className = "tracker stcard";
  if (latest) det.open = true;
  const sum = document.createElement("summary");
  const info = [st.people.length && `人物 ${st.people.length}`, st.groups.length && `行程 ${st.groups.reduce((a, g) => a + g.items.length, 0)}`].filter(Boolean).join("・");
  sum.innerHTML = `<span class="ttl">狀態</span>${info ? `<span class="sub">${esc(info)}</span>` : ""}`;
  det.append(sum);
  const body = document.createElement("div");
  body.className = "st-body";

  // 人物：每人一張小卡，可各自收合（三人以上只先展開第一位）
  if (st.people.length) {
    const box = document.createElement("div");
    box.className = "st-people";
    st.people.forEach((p, n) => {
      const pd = document.createElement("details");
      pd.className = "st-person";
      const pdDef = st.people.length <= 2 || n === 0;
      const ps = document.createElement("summary");
      ps.innerHTML = `<span class="ava">${esc([...p.name.replace(/^[^\p{L}\p{N}]+/u, "")][0] || "?")}</span><span>${inline(p.name)}</span>`;
      const rows = stRows(p.rows);
      // 最後一行通常是關係進度：拉出來放在卡片底部，像小工具的「關係」欄
      if (p.rows.length >= 3) rows.lastElementChild.classList.add("rel");
      pd.append(ps, rows);
      foldable(pd, `person:${imName(p.name)}`, pdDef);
      box.append(pd);
    });
    body.append(stSection("人物", box));
  }
  if (st.player.length) body.append(stSection(playerName() || "玩家", stRows(st.player)));
  if (st.nodes.length) body.append(stSection("劇情", stRows(st.nodes)));

  for (const g of st.groups) {
    const tl = document.createElement("div");
    tl.className = "st-sched";
    for (const it of g.items) {
      const d = document.createElement("div");
      d.className = "st-item";
      d.innerHTML =
        `<div class="tm">${inline(it.time)}</div>` +
        `<div class="ct">${it.who ? `<span class="who">${inline(it.who)}</span>` : ""}${it.place ? `<span class="pl">📍 ${inline(it.place)}</span>` : ""}` +
        `${it.text.length ? `<div>${it.text.map(inline).join("｜")}</div>` : ""}` +
        `${it.note ? `<div class="nt">${inline(it.note)}</div>` : ""}</div>`;
      tl.append(d);
    }
    // 行程預設收合；標題沿用後台自己的 emoji（例：㊙️ 駱懷柏 機密行程雷達、🥏 星盤行運追蹤）
    const fd = document.createElement("details");
    fd.className = "st-fold";
    const fs = document.createElement("summary");
    fs.innerHTML = `<span class="t">${inline(g.title ? stTitle(g.title) : "🗓️ 行程")}</span><span class="n">${g.items.length} 筆</span>`;
    fd.append(fs, tl);
    foldable(fd, `sched:${imName(stTitle(g.title || "行程")).replace(/\d+/g, "")}`, false);
    body.append(fd);
  }

  // 系統小幫手：評論與吃瓜收在折疊裡；三條路拿出來放在卡片底部，最靠近輸入框
  const allOps = [];
  for (const h of st.helpers) {
    if (h.options.length) allOps.push(h);
    if (!h.lines.length) continue;
    const hd = document.createElement("details");
    hd.className = "st-helper";
    const hs = document.createElement("summary");
    hs.textContent = h.title || "小幫手";
    const hb = document.createElement("div");
    hb.className = "st-hbody";
    hb.innerHTML = h.lines.map((l) => `<div>${inline(l)}</div>`).join("");
    hd.append(hs, hb);
    foldable(hd, `helper:${imName(h.title || "小幫手")}`, false);
    body.append(hd);
  }

  if (st.misc.length) {
    const m = document.createElement("div");
    m.className = "st-misc";
    m.innerHTML = st.misc.map((l) => `<div>${inline(l)}</div>`).join("");
    body.append(m);
  }

  for (const h of allOps) {
    const box = document.createElement("div");
    box.className = "st-opbox";
    if (h.optLabel) {
      const lab = document.createElement("div");
      lab.className = "st-oplab";
      lab.innerHTML = inline(h.optLabel);
      box.append(lab);
    }
    const ops = document.createElement("div");
    ops.className = "st-ops";
    for (const o of h.options) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = inline(o);
      b.onclick = () => fillInput(o.replace(/^[^①②③④⑤❶❷❸❹❺]*[①②③④⑤❶❷❸❹❺]\s*/, ""));
      ops.append(b);
    }
    box.append(ops);
    body.append(box);
  }

  // 翻看：收在狀態卡最下面，預設收合
  if (latest && lorebook.length) {
    const pk = document.createElement("details");
    pk.className = "peek st-peek";
    const ps = document.createElement("summary");
    ps.innerHTML = '翻看<span class="spark">✧</span>';
    const chips = document.createElement("div");
    chips.className = "chips";
    for (const e of lorebook) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = `${e.icon || "📂"} ${e.name}`;
      b.onclick = () => { fillInput(((e.keys || [])[0] || "") + " "); pk.open = false; foldMem.peek = false; store.set("rp_fold", foldMem); };
      chips.append(b);
    }
    pk.append(ps, chips);
    foldable(pk, "peek", false);
    pk.addEventListener("toggle", () => { if (pk.open) chips.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    body.append(pk);
  }

  det.append(body);
  return det;
}

// ---------- 翻看 ----------
function isLoreSep(t) { return /^✦\s*─/.test(t); }

// 論壇留言（💬 之後的 ▸ 樓層與 ▾ 樓主回覆）接在最後一條分隔線後面，一起收進卡片
function loreCommentsEnd(lines, start, end) {
  let k = start;
  while (k < end && !lines[k].trim()) k++;
  if (k >= end || !/^💬/.test(lines[k].trim())) return start;
  let stop = k;
  while (stop < end) {
    const raw = lines[stop];
    const t = raw.trim();
    if (!t) {
      let n = stop + 1;
      while (n < end && !lines[n].trim()) n++;
      if (n < end && /^[▸▾]/.test(lines[n].trim())) { stop = n; continue; }
      break;
    }
    if (/^[▸▾💬]/.test(t) || /^[\s　]/.test(raw)) { stop++; continue; }
    break;
  }
  return stop;
}

function renderLoreCard(block) {
  const card = document.createElement("div");
  card.className = "lore-card";
  const secs = [[]];
  for (const l of block) {
    if (isLoreSep(l.trim())) { if (secs[secs.length - 1].length) secs.push([]); }
    else secs[secs.length - 1].push(l);
  }
  secs.filter((s) => s.some((l) => l.trim())).forEach((sec, n) => {
    const box = document.createElement("div");
    box.className = "lore-sec" + (n === 0 ? " title" : "");
    // 去掉區段頭尾空行
    while (sec.length && !sec[0].trim()) sec.shift();
    while (sec.length && !sec[sec.length - 1].trim()) sec.pop();
    sec.forEach((raw, idx) => {
      const t = raw.trim();
      const next = (sec.slice(idx + 1).find((l) => l.trim()) || "").trim();
      const line = document.createElement("div");
      let cls = "lore-line";
      let body = t;
      // 「🗑️｜文字」→ 圖示＋文字；短的視為小標題（已刪除、待辦…），長的是內容（日記的 🩹、🔒）
      const em = t.match(/^([^\s｜]{1,3})｜\s*(.*)$/);
      if (!t) cls += " gap";
      else if (/^└/.test(t)) { cls += " sub"; body = t.replace(/^└\s*/, ""); }
      else if (/^▸/.test(t)) cls += " floor";
      else if (/^▾/.test(t) || (/^[\s　]{2,}/.test(raw) && n > 0)) cls += " reply";
      else if (em) {
        body = `${em[1]} ${em[2]}`;
        if (n > 0 && em[2].replace(/\s/g, "").length <= 10 && /^└/.test(next)) cls += " lab";
        else if (n > 0) cls += " note";
      }
      line.className = cls;
      line.innerHTML = inline(body);
      box.append(line);
    });
    card.append(box);
  });
  return card;
}

function renderPeek() {
  const det = document.createElement("details");
  det.className = "peek";
  const sum = document.createElement("summary");
  sum.innerHTML = '翻看<span class="spark">✧</span>';
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const e of lorebook) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = `${e.icon || "📂"} ${e.name}`;
    b.onclick = () => {
      const cmd = (e.keys || [])[0] || "";
      $("input").value = cmd + " ";
      autoGrow();
      $("input").focus();
      det.open = false;
    };
    chips.append(b);
  }
  det.append(sum, chips);
  // 展開時捲到看得見按鈕
  det.addEventListener("toggle", () => { if (det.open) chips.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
  return det;
}

// ---------- 記憶庫寫入標記 ----------
let saving = null;   // 進行中的寫入 { cid, sid, from, to }
let saveFail = null; // 最近一次失敗 { cid, sid, to, msg }

function sameSlot(job) {
  const s = curSlot();
  return job && s && job.cid === settings.character && job.sid === s.id;
}

function showSaveMark(to, state, text) {
  chatEl.querySelectorAll(`.save-mark[data-to="${to}"]`).forEach((x) => x.remove());
  const pageEl = chatEl.querySelector(`.page[data-page="${to}"]`);
  if (!pageEl) return;
  const anchor = pageEl.nextElementSibling && pageEl.nextElementSibling.classList.contains("usage") ? pageEl.nextElementSibling : pageEl;
  const m = document.createElement("div");
  m.className = `pill save-mark ${state}`;
  m.dataset.to = to;
  if (state === "saving") m.innerHTML = `<span class="dot">📝</span> 正在寫入記憶庫 ${esc(text)}…`;
  else if (state === "fail") { m.textContent = `⚠︎ ${text} 寫入記憶庫失敗・點這裡重試`; m.onclick = () => runSave(true); m.setAttribute("role", "button"); }
  else m.textContent = `📝 已寫入記憶庫 ${text} ✧`;
  anchor.after(m);
}

// 這一窗寫入記憶庫滿 WINDOW_EVERY 頁：在最新的寫入標記下方提示換窗，點了直接換窗
function windowDue() {
  const s = curSlot();
  if (!s) return false;
  return loadMem().saved - (s.base || 0) >= WINDOW_EVERY;
}
function showWindowHint() {
  chatEl.querySelectorAll(".win-hint").forEach((x) => x.remove());
  if (!windowDue()) return;
  const mark = chatEl.querySelector(`.save-mark.done[data-to="${loadMem().saved}"]`);
  if (!mark) return;
  const h = document.createElement("div");
  h.className = "pill win-hint";
  h.setAttribute("role", "button");
  h.tabIndex = 0;
  h.textContent = "🪟 建議換窗接續・點這裡";
  h.onclick = () => newWindow();
  h.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); newWindow(); } };
  mark.after(h);
}

function renderSaveMarks() {
  if (!curSlot()) return;
  for (const f of loadMem().frags) if (!f.imported) showSaveMark(f.to, "done", `Page.${f.from}-${f.to}`);
  if (sameSlot(saving)) showSaveMark(saving.to, "saving", `Page.${saving.from}-${saving.to}`);
  if (sameSlot(saveFail)) showSaveMark(saveFail.to, "fail", `Page.${saveFail.from}-${saveFail.to}`);
  showWindowHint();
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// 把目前存檔尚未寫入的頁數整理成一份記憶片段；回傳 true＝已寫入或沒有要寫入的
async function runSave(manual = false) {
  const s = curSlot();
  if (!s) return false;
  if (saving) { if (manual) toast("記憶庫正在寫入，請稍等一下"); return false; }
  const cid = settings.character;
  const sid = s.id;
  const mem = loadMem(cid, sid);
  const from = mem.saved + 1;
  const to = s.pages || 0;
  if (to < from) { if (manual) toast("目前沒有新的頁面需要寫入記憶庫"); return true; }
  const transcript = sliceTranscript(history, from, to);
  if (!transcript.length) return true;

  const job = { cid, sid, from, to, epoch: mem.epoch || 0 };
  saving = job;
  if (sameSlot(saveFail) && saveFail.to <= to) saveFail = null;
  showSaveMark(to, "saving", `Page.${from}-${to}`);
  try {
    const data = await callWorker("/save", {
      key: settings.key,
      model: settings.model,
      character: cid,
      from,
      to,
      evtStart: nextEvt(mem),
      playerName: playerName(),
      characterName: settings.characterName,
      slotName: s.name,
      date: today(),
      transcript,
      memory: buildMemory(mem, s.name),
    });
    // 寫入期間若開了新遊戲或回捲，這份結果就作廢
    const now = loadMem(cid, sid);
    if ((now.epoch || 0) !== job.epoch || now.saved !== from - 1) return false;
    now.frags.push({ from, to, date: today(), story: storyDates(transcript), text: data.text, at: Date.now() });
    now.saved = to;
    saveMem(cid, sid, now);
    if (sameSlot(job)) {
      showSaveMark(to, "done", `Page.${from}-${to}`);
      showWindowHint();
      if (windowDue()) toast(`已寫入記憶庫 Page.${from}-${to}・建議換窗接續 🪟`);
      else if (manual) toast(`已寫入記憶庫 Page.${from}-${to} ✧`);
    }
    return true;
  } catch (e) {
    saveFail = { cid, sid, from, to, msg: e.message };
    if (sameSlot(job)) { showSaveMark(to, "fail", `Page.${from}-${to}`); toast(`寫入記憶庫失敗：${e.message}`); }
    return false;
  } finally {
    saving = null;
  }
}

];
// [貼圖]、[貼圖：翻白眼的貓]、（傳了一張照片：…）、【語音 0:12】等寫法都認
const IM_MEDIA = /^[\[（(【](?:傳送了?|傳了|發了|分享了?)?(?:一張|一則|一段|一個)?(照片|圖片|相片|影像|貼圖|語音|影片|限動截圖|截圖|檔案|位置|通話|未接來電)(?:[:：\s]\s*([^\]）)】]*))?[\]）)】]$/;

function imParse(block) {
  let sep = block.findIndex((l) => /^\s*✧\s*─/.test(l));
  if (sep < 0) sep = Math.min(2, block.length);
  const meta = block.slice(0, sep).map((l) => l.trim()).filter(Boolean);
  const lines = block.slice(sep + (block[sep] && /✧/.test(block[sep]) ? 1 : 0)).filter((l) => l.trim());
  const whoLine = meta.find((l) => l.startsWith("👤")) || "";
  const typeLine = meta.find((l) => l !== whoLine) || "";
  const parts = typeLine.split("｜").map((x) => x.trim()).filter(Boolean);
  const date = (parts.find((x) => x.startsWith("🗓")) || "").replace(/^🗓\s*/, "");
  const time = (parts.find((x) => x.startsWith("🕒")) || "").replace(/^🕒\s*/, "");
  const rest = parts.filter((x) => !x.startsWith("🗓") && !x.startsWith("🕒"));
  const type = rest[0] || "";
  const platform = rest[1] || "";
  const extras = rest.slice(2); // 例如「🔥快速擴散」「匿名顯示」「03:12」
  const msgs = lines.map((raw) => {
    const line = raw.trim().replace(/^[‣▸▹•·・\-–—*]+\s*/, "");
    // [影像：…]、（傳了一張照片：…）整行是媒體或旁白，不拆說話者
    const m = /^[\[（(【]/.test(line) ? null : line.match(/^([^:：「」\[\]（）【】]{1,24})[:：]\s*(.*)$/);
    let speaker = m ? m[1].trim() : "";
    let body = m ? m[2] : line;
    let t = "";
    const tm = body.match(/^(.*?)[\s　]+(\d{1,2}:\d{2})\s*$/);
    if (tm) { body = tm[1]; t = tm[2]; }
    return { speaker, body: body.trim(), time: t };
  });
  return { who: whoLine.replace(/^👤\s*/, ""), type, platform, extras, date, time, msgs };
}

// 名字比對：忽略空白、@ 與前綴符號（「真壁 郁」＝「真壁郁」）
function imName(x) { return String(x || "").replace(/[\s　@＠]/g, "").replace(/^[^\p{L}\p{N}]+/u, ""); }
function imSame(a, b) { a = imName(a); b = imName(b); return !!(a && b && (a.includes(b) || b.includes(a))); }

function imColor(platform) {
  for (const [re, c] of APP_COLORS) if (re.test(platform)) return c;
  return "";
}

// 「2026.10.11」→「10/11（日）」，認不出就原樣
function imDay(date) {
  const d = String(date).match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (!d) return date;
  const w = "日一二三四五六"[new Date(+d[1], +d[2] - 1, +d[3]).getDay()];
  return `${+d[2]}/${+d[3]}（${w}）`;
}

function imFrame(p, kind) {
  const wrap = document.createElement("div");
  wrap.className = "im" + (kind ? " " + kind : "");
  const c = imColor(p.platform);
  if (c) wrap.style.setProperty("--app", c);
  const notch = document.createElement("div");
  notch.className = "im-notch";
  notch.textContent = "✧✦ ───── ✦✧";
  wrap.append(notch);
  return wrap;
}

function imBar(p, extra = "") {
  const bar = document.createElement("div");
  bar.className = "im-bar";
  const sub = [p.type, p.platform].filter(Boolean).map(inline).join("・");
  bar.innerHTML =
    `<span class="back">‹</span>` +
    `<div class="ttl"><div class="who">${inline(p.who || p.platform || "訊息")}</div>` +
    `<div class="sub">${p.platform ? '<span class="dot"></span>' : ""}${sub}${extra}</div></div>` +
    `<span class="more">⋯</span>`;
  return bar;
}

function imHome(wrap) {
  const h = document.createElement("div");
  h.className = "im-home";
  h.textContent = "✧ ── ✦";
  wrap.append(h);
}

// 依類型名稱、平台、內容三種線索判斷畫面；先符合的先套用，都不符合就是手機聊天
function imKind(p) {
  const t = `${p.type} ${p.extras.join(" ")}`;
  const body = p.msgs.map((m) => m.body).join("\n");
  const plat = p.platform;
  if (/公告|聲明|官方通知|announcement/i.test(t)) return "notice";
  if (/通話|電話|來電|視訊|\bcall\b|facetime/i.test(t) || /接通|掛斷|未接來電|通話時長/.test(body)) return "call";
  if (/直播|開台|\blive\b|舞台|演唱|錄影|廣播|電台|podcast|配音|彈幕/i.test(t) || /贈禮|斗內|抖內|打賞/.test(body)) return "live";
  const chatType = /私訊|訊息|聊天|群組|\bdm\b|chat/i.test(t);
  const socialPlat = /threads|^x$|twitter|dcard|ptt|plurk|微博|小紅書|facebook|臉書|巴哈|reddit/i.test(plat);
  const stats = /(❤️|♥️?|👍|💬|🔁|↻|讚|留言|分享|轉發)\s*[:：]?\s*[\d.,]+\s*[KkMmWw萬千]?/.test(body);
  const tagOrPhoto = /(^|\s)#[^\s#]+/.test(body) || /[\[（(【](?:傳了|發了|分享了?)?(?:一張)?(照片|圖片|相片)/.test(body);
  if (/貼文|動態|限動|快拍|發文|論壇|社群|爆料|推文|討論|\bpost\b|tweet|story|stories/i.test(t)) return "post";
  if (chatType) return "chat"; // 類型寫明私訊、群組就一定是聊天
  if (socialPlat) return "post";
  if (stats && tagOrPhoto) return "post";
  return "chat";
}

function renderIM(block) {
  const p = imParse(block);
  const kind = imKind(p);
  if (kind === "notice") return renderNotice(p);
  if (kind === "call") return renderCall(p);
  if (kind === "live") return renderLive(p);
  if (kind === "post") return renderPost(p);

  const wrap = imFrame(p);
  wrap.append(imBar(p));
  const list = document.createElement("div");
  list.className = "im-msgs";
  if (p.date) {
    const day = document.createElement("div");
    day.className = "im-day";
    day.textContent = `🗓 ${imDay(p.date)}`;
    list.append(day);
  }

  // 手機主人靠右：玩家有在對話裡就是玩家；玩家不在（角色自己的群組）就是角色本人
  const same = imSame;
  const me = playerName();
  const char = settings.characterName || "";
  const owner = p.msgs.some((m) => same(m.speaker, me)) ? me : char;

  let prev = "";
  for (const m of p.msgs) {
    const row = document.createElement("div");
    if (!m.speaker) {
      row.className = "im-row sys";
      row.innerHTML = inline(m.body);
      list.append(row);
      prev = "";
      continue;
    }
    const mine = same(m.speaker, owner);
    row.className = "im-row" + (mine ? " me" : "") + (m.speaker === prev ? " cont" : "");
    prev = m.speaker;
    const ava = document.createElement("div");
    ava.className = "ava";
    ava.textContent = [...m.speaker.replace(/^[^\p{L}\p{N}]+/u, "")][0] || "?";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = m.speaker;
    const line = document.createElement("div");
    line.className = "line";
    const bub = document.createElement("div");
    bub.className = "bub";
    const media = m.body.match(IM_MEDIA);
    if (media) {
      bub.classList.add("media");
      bub.append(imMedia(media[1], media[2] || ""));
    } else {
      bub.innerHTML = inline(m.body).replace(/\[([^\]\n]{1,12})\]/g, '<span class="im-chip">$1</span>');
    }
    line.append(bub);
    if (m.time || mine) {
      const st = document.createElement("div");
      st.className = "stamp";
      st.innerHTML = [mine ? "已讀" : "", m.time].filter(Boolean).map(esc).join("<br>");
      line.append(st);
    }
    row.append(ava, name, line);
    list.append(row);
  }
  wrap.append(list);

  const input = document.createElement("div");
  input.className = "im-input";
  input.innerHTML = '<span>＋</span><span class="box">輸入訊息…</span><span class="send">✦</span>';
  wrap.append(input);
  imHome(wrap);
  return wrap;
}

function imMedia(kind, cap) {
  const d = document.createElement("div");
  if (/照片|圖片|相片|影像|截圖/.test(kind)) {
    d.className = "im-media photo";
    d.innerHTML = `<span class="ic">${/限動/.test(kind) ? "🎞️" : "📷"}</span><span class="cap">${esc(cap || kind)}</span>`;
  } else if (kind === "貼圖") {
    // 模型多半用文字描述貼圖：純 emoji 就放大顯示，文字描述就畫成貼圖卡
    const emojiOnly = cap && /^[\p{Extended_Pictographic}\u200d\ufe0f\s]+$/u.test(cap);
    if (emojiOnly) { d.className = "im-media sticker"; d.textContent = cap.trim(); }
    else { d.className = "im-media stk-card"; d.innerHTML = cap ? `<span class="lab">✦ 貼圖</span><span class="txt">${esc(cap)}</span>` : `<span class="txt">✦ 貼圖</span>`; }
  } else if (kind === "語音") {
    d.className = "im-media voice";
    d.innerHTML = `<span>▶</span><span class="wave">ılıılıılı</span><span>${esc(cap || "0:08")}</span>`;
  } else {
    d.className = "im-media voice";
    const ic = { 影片: "🎬", 檔案: "📎", 位置: "📍", 通話: "📞", 未接來電: "📵" }[kind] || "✦";
    d.innerHTML = `<span>${ic}</span><span>${esc(cap ? `${kind}・${cap}` : kind)}</span>`;
  }
  return d;
}

// 直播、舞台、錄影、廣播：彈幕留言串；角色本人的發言標「主播」
function renderLive(p) {
  const wrap = imFrame(p, "live");
  const extra = ` <span class="live">● LIVE</span>${p.time ? ` <span class="view">🕒${esc(p.time)}</span>` : ""}`;
  wrap.append(imBar(p, extra));
  const stage = document.createElement("div");
  stage.className = "live-stage";
  stage.textContent = `${p.type || "直播"}${p.who ? `・${p.who}` : ""}`;
  wrap.append(stage);
  const list = document.createElement("div");
  list.className = "live-list";
  const char = settings.characterName || "";
  const hue = (s) => [...s].reduce((a, ch) => (a * 31 + ch.codePointAt(0)) % 360, 7);
  for (const m of p.msgs) {
    const c = document.createElement("div");
    c.className = "c";
    const gift = /贈禮|禮物|斗內|抖內|打賞|贊助/.test(m.body);
    const host = char && m.speaker && (m.speaker.includes(char) || char.includes(m.speaker));
    if (gift) c.classList.add("gift");
    if (host) c.classList.add("host");
    const who = m.speaker
      ? `${host ? '<span class="tag">主播</span>' : ""}<b style="color:hsl(${hue(m.speaker)} 55% var(--live-l))">${esc(m.speaker)}</b>`
      : "";
    c.innerHTML = `${who}${inline(m.body)}${m.time ? `<span class="t">${esc(m.time)}</span>` : ""}`;
    list.append(c);
  }
  wrap.append(list);
  imHome(wrap);
  return wrap;
}


// ---------- 5.3 社群貼文：作者、內文、附圖格、互動數、留言 ----------
const POST_STAT = /(❤️|♥️?|👍|💬|🔁|↻|🔄|📤|分享|轉發|轉貼|按讚|愛心|留言|回覆)\s*[:：]?\s*[\d.,]+\s*[KkMmWw萬千]?/;

// 限動圈（不分平台）：一般限動＝漸層圈；限定（摯友、會員限定、私密…）＝綠圈＋星章，膠囊文字照模型寫的名稱
const STORY_RE = /限動|限時動態|快拍|\bstory\b|\bstories\b/i;
const LIMIT_WORD = /摯友|密友|親密好友|close\s*friends?|好友限定|私密|限定/i;
const LIMIT_BODY = /摯友|密友|親密好友|close\s*friends?/i; // 內文只認明確的摯友字樣，避免「期間限定」之類誤判
function storyRing(p) {
  const head = `${p.type} ${p.extras.join(" ")}`;
  // 限定名稱：優先取 extras 那一格；其次從類型行取出含關鍵字的那一段（例：限動・摯友限定 → 摯友限定）
  const clean = (s) => String(s).replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "").trim();
  let cell = p.extras.find((x) => LIMIT_WORD.test(x)) || "";
  let label = cell ? clean(cell) : "";
  if (!label) {
    const seg = String(p.type).split(/[・\s／/,，、()（）\[\]【】]+/).find((x) => LIMIT_WORD.test(x));
    if (seg) label = clean(seg);
  }
  if (!label && STORY_RE.test(head)) {
    const body = p.msgs.map((m) => m.body).join("\n");
    const m = body.match(LIMIT_BODY);
    if (m) label = m[0];
  }
  if (label) return { kind: "limited", label, cell };
  if (STORY_RE.test(head)) return { kind: "story", label: "", cell: "" };
  return { kind: "", label: "", cell: "" };
}

function renderPost(p) {
  const wrap = imFrame(p, "post");
  // 模型常把「內文：」「影像：」「💬 留言：」寫成說話者，這些是欄位標籤，不是人
  const LABEL_BODY = /^(內文|正文|貼文|文字|文案|說明|配文|caption|text|動態)$/i;
  const LABEL_MEDIA = /^(影像|照片|圖片|相片|附圖|截圖|影片)$/;
  const LABEL_CMT = /^(留言|評論|回覆|留言區|comments?)$/i;
  const firstReal = p.msgs.find((m) => m.speaker && !LABEL_BODY.test(imName(m.speaker)) && !LABEL_MEDIA.test(imName(m.speaker)) && !LABEL_CMT.test(imName(m.speaker)));
  const labelled = p.msgs.some((m) => m.speaker && (LABEL_BODY.test(imName(m.speaker)) || LABEL_MEDIA.test(imName(m.speaker))));
  const author = (labelled ? p.who : (firstReal && firstReal.speaker) || p.who) || "匿名";
  const head = document.createElement("div");
  const ring = storyRing(p);
  head.className = "post-head" + (ring.kind ? " ringed" : "");
  // 限定名稱已改成綠色膠囊，右側紅色標籤不重複
  const tags = p.extras.filter((t) => t !== ring.cell).map((t) => `<span class="post-tag">${inline(t)}</span>`).join("");
  const ava = `<div class="ava">${esc([...author.replace(/^[^\p{L}\p{N}]+/u, "")][0] || "?")}</div>`;
  const subParts = [p.platform && inline(p.platform), ring.label && `<span class="lim-tag">★ ${inline(ring.label)}</span>`, p.who && p.who !== author ? inline(p.who) : "", p.time && inline(`${p.time} 發布`)].filter(Boolean);
  head.innerHTML =
    (ring.kind ? `<div class="ring ${ring.kind}">${ava}</div>` : ava) +
    `<div class="meta"><div class="name">${inline(author)}</div>` +
    `<div class="sub">${p.platform ? '<span class="dot"></span>' : ""}${subParts.join("・")}</div></div>` +
    `<div class="tags">${tags}</div>`;
  wrap.append(head);

  const body = document.createElement("div");
  body.className = "post-body";
  const photos = [];
  const stats = [];
  const comments = [];
  let inPost = true;
  let photoFirst = null;
  for (const m of p.msgs) {
    if (photoFirst === null) photoFirst = undefined;
    const label = imName(m.speaker);
    if (LABEL_CMT.test(label) || (!m.speaker && /^💬?\s*(留言|評論|留言區)\s*[:：]?$/.test(m.body))) {
      inPost = false;
      if (m.body && !/^(留言|評論|留言區)?\s*[:：]?$/.test(m.body)) comments.push({ speaker: "", body: m.body, time: m.time });
      continue;
    }
    if (LABEL_MEDIA.test(label)) { if (!body.childNodes.length && photoFirst === undefined) photoFirst = true; photos.push(m.body.replace(/^[\[（(【]|[\]）)】]$/g, "")); continue; }
    const media = m.body.match(IM_MEDIA);
    if (POST_STAT.test(m.body) && !m.speaker) { stats.push(m.body); continue; }
    if (inPost && (!m.speaker || LABEL_BODY.test(label) || imSame(m.speaker, author))) {
      if (media && /照片|圖片|相片|影像|截圖/.test(media[1])) { if (!body.childNodes.length && photoFirst === undefined) photoFirst = true; photos.push(media[2] || ""); continue; }
      const para = document.createElement("p");
      para.innerHTML = inline(m.body).replace(/(^|\s)(#[^\s#]+)/g, '$1<span class="hash">$2</span>');
      body.append(para);
      continue;
    }
    inPost = false;
    comments.push(m);
  }
  wrap.append(body);

  if (photos.length) {
    const g = document.createElement("div");
    g.className = "post-photos";
    g.innerHTML = `<div class="cap">🖼 附圖・${photos.length}張</div>`;
    const grid = document.createElement("div");
    grid.className = "grid" + (photos.length === 1 ? " one" : "");
    photos.forEach((c, i) => {
      const cell = document.createElement("div");
      cell.className = "ph";
      cell.innerHTML = `<span class="ic">📷</span><b>照片 ${i + 1}</b><span>${esc(c)}</span>`;
      grid.append(cell);
    });
    g.append(grid);
    if (photoFirst === true) body.before(g); else wrap.append(g);
  }

  const bar = document.createElement("div");
  bar.className = "post-stats";
  bar.innerHTML = stats.length ? stats.map(inline).join("　") : "♡　💬　↻　➤";
  wrap.append(bar);

  if (comments.length) {
    const list = document.createElement("div");
    list.className = "post-comments";
    for (const c of comments) {
      const d = document.createElement("div");
      d.className = "cm";
      const op = imSame(c.speaker, author) ? '<span class="op">作者</span>' : "";
      d.innerHTML = `<b>${esc(c.speaker || "")}</b>${op}<span>${inline(c.body)}</span>${c.time ? `<i>${esc(c.time)}</i>` : ""}`;
      list.append(d);
    }
    wrap.append(list);
  }
  imHome(wrap);
  return wrap;
}

// ---------- 5.3 通話中：頭像、通話時間、逐句字幕、控制鍵 ----------
function renderCall(p) {
  const video = /視訊/.test(p.type);
  const wrap = imFrame(p, "call" + (video ? " video" : ""));
  const me = playerName();
  const char = settings.characterName || "";
  const same = imSame;
  // 手機主人：玩家有發言就是玩家，否則是角色本人（例如角色和部下的通話）
  const owner = p.msgs.some((m) => same(m.speaker, me)) ? me : char;
  // 通話對象：「A ⇄ B」取不是主人的那位；沒有 👤 行就取第一個不是主人的說話者
  const names = p.who ? p.who.split(/\s*(?:⇄|↔|⟷|⇆|×|✕|&|＆|→|與)\s*/).filter(Boolean) : [];
  const other = names.find((n) => !same(n, owner)) || ((p.msgs.find((m) => m.speaker && !same(m.speaker, owner)) || {}).speaker) || names[0] || char || "通話";
  const title = p.who || other;
  // 通話時長：類型行第三格的 03:12；沒有就用第一句到最後一句的時間
  const stamps = p.msgs.map((m) => m.time).filter(Boolean);
  const dur = p.extras.find((x) => /\d{1,2}:\d{2}/.test(x)) || (stamps.length > 1 && stamps[0] !== stamps[stamps.length - 1] ? `${stamps[0]} – ${stamps[stamps.length - 1]}` : "");
  const missed = p.msgs.some((m) => /未接|拒接|已結束|掛斷/.test(m.body)) ;
  const top = document.createElement("div");
  top.className = "call-top";
  top.innerHTML =
    `<div class="sub">${p.platform ? '<span class="dot"></span>' : ""}${inline([p.platform, p.type].filter(Boolean).join("・"))}</div>` +
    `<div class="ava big">${esc([...other.replace(/^[^\p{L}\p{N}]+/u, "")][0] || "?")}</div>` +
    `<div class="who">${inline(title)}</div>` +
    `<div class="state">${missed ? "通話已結束" : "通話中"}${dur ? `・${esc(dur.replace(/^[^\d]*/, ""))}` : ""}</div>`;
  wrap.append(top);
  if (video) {
    const pip = document.createElement("div");
    pip.className = "pip";
    pip.textContent = owner || me || "你";
    wrap.append(pip);
  }

  const list = document.createElement("div");
  list.className = "call-lines";
  for (const m of p.msgs) {
    const d = document.createElement("div");
    if (!m.speaker || IM_MEDIA.test(m.body)) {
      d.className = "ln sys";
      d.innerHTML = inline(m.body.replace(/^[\[（(【]|[\]）)】]$/g, ""));
    } else {
      d.className = "ln" + (same(m.speaker, owner) ? " me" : "");
      d.innerHTML = `<b>${esc(m.speaker)}</b><span>${inline(m.body)}</span>`;
    }
    list.append(d);
  }
  wrap.append(list);

  const ctl = document.createElement("div");

// 每則回覆下方顯示這一輪的 token 用量
function fmt(n) {
  if (!n) return "0";
  if (n >= 10000) return (n / 10000).toFixed(1) + " 萬";
  if (n >= 1000) return (n / 1000).toFixed(1) + " 千";
  return String(n);
}
function usageText(u) {
  if (!u) return "";
  const parts = [`輸入 ${fmt(u.promptTokenCount)}`];
  if (u.cachedContentTokenCount) parts.push(`其中快取 ${fmt(u.cachedContentTokenCount)}`);
  parts.push(`輸出 ${fmt(u.candidatesTokenCount)}`);
  if (u.thoughtsTokenCount) parts.push(`思考 ${fmt(u.thoughtsTokenCount)}`);
  return parts.join("・") + " token";
}
