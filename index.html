<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>mcx_purple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* 深色：夜讀 */
  :root {
    --bg: #17131d; --page: #1e1925; --panel: #221c2a; --panel-2: #2c2436; --line: #3a3046;
    --text: #e7e0ee; --muted: #9d92ab; --accent: #c3a3e6; --accent-ink: #1b1424;
    --accent-soft: rgba(195, 163, 230, .13); --danger: #e8909f;
    --accent-line: rgba(195, 163, 230, .42);
    --phone: #141018; --bubble-them: #2c2436; --bubble-me: #5b4378; --bubble-me-ink: #f4ecfb;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  /* 淺色：霧紫信紙 */
  :root[data-theme="light"] {
    --bg: #eeebf2; --page: #f9f7fb; --panel: #ffffff; --panel-2: #ebe5f1; --line: #ddd5e6;
    --text: #2e2638; --muted: #7d7189; --accent: #7a4e92; --accent-ink: #ffffff;
    --accent-soft: rgba(122, 78, 146, .10); --danger: #b04a5c;
    --accent-line: rgba(122, 78, 146, .32);
    --phone: #f1edf6; --bubble-them: #ffffff; --bubble-me: #7a4e92; --bubble-me-ink: #ffffff;
    --shadow: 0 10px 28px rgba(60, 40, 80, .12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #eeebf2; --page: #f9f7fb; --panel: #ffffff; --panel-2: #ebe5f1; --line: #ddd5e6;
      --text: #2e2638; --muted: #7d7189; --accent: #7a4e92; --accent-ink: #ffffff;
      --accent-soft: rgba(122, 78, 146, .10); --danger: #b04a5c;
    --accent-line: rgba(122, 78, 146, .32);
      --phone: #f1edf6; --bubble-them: #ffffff; --bubble-me: #7a4e92; --bubble-me-ink: #ffffff;
      --shadow: 0 10px 28px rgba(60, 40, 80, .12);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 6px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; flex: 1; min-width: 0; cursor: pointer; font-family: "Noto Serif TC", serif;
    font-size: 18px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 small { display: block; font-family: "Noto Sans TC", sans-serif; font-size: 11.5px; font-weight: 400;
    letter-spacing: 0; color: var(--muted); margin-top: 1px; }

  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 8px; white-space: nowrap; font-size: 14px; }
  button.ghost:hover { color: var(--text); }

  /* 閱讀區 */
  #chat { flex: 1; overflow-y: auto; padding: 24px 18px 32px; display: flex; flex-direction: column; gap: 22px; }
  #chat > * { width: 100%; max-width: 36em; margin-left: auto; margin-right: auto; }

  .page { font-family: "Noto Serif TC", "Songti TC", serif; font-size: 17px; line-height: 2.05;
    letter-spacing: .03em; color: var(--text); word-break: break-word; }
  .page p { margin: 0 0 1.15em; }
  .page p:last-child { margin-bottom: 0; }
  .page strong { font-weight: 600; }

  /* Markdown：標題、分隔線、清單、引用、表格、程式碼框 */
  .page h1, .page h2, .page h3, .page h4, .page h5, .page h6 { font-family: "Noto Sans TC", sans-serif; color: var(--accent);
    font-weight: 700; line-height: 1.6; letter-spacing: .04em; margin: 1.5em 0 .45em; }
  .page h1 { font-size: 1.3em; } .page h2 { font-size: 1.16em; } .page h3 { font-size: 1.04em; }
  .page h4, .page h5, .page h6 { font-size: .95em; }
  .page > :first-child { margin-top: 0; }
  .page hr { border: 0; border-top: 1px solid var(--line); width: 40%; margin: 1.7em auto; }
  .page em { font-style: normal; color: color-mix(in srgb, var(--text) 55%, var(--muted)); }
  .page ul, .page ol { margin: 0 0 1.15em; padding-left: 1.5em; }
  .page blockquote { margin: 0 0 1.15em; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent-line); color: var(--muted); }
  .page .tbl { overflow-x: auto; margin: 0 0 1.15em; }
  .page table { border-collapse: collapse; font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.7; letter-spacing: 0; }
  .page th, .page td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .page th { background: var(--panel-2); }
  .page code { font-family: inherit; background: var(--panel-2); border-radius: 5px; padding: 1px 5px; font-size: .9em; }
  .codecard { margin: 6px 0 1.4em; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .codecard pre { margin: 0; padding: 14px 16px 6px; font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.9;
    letter-spacing: .02em; white-space: pre-wrap; word-break: break-word; }
  .codecard pre code { background: none; padding: 0; font-size: inherit; }
  .codecard .bar { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 10px 10px; }
  .codecard .bar button { font-family: "Noto Sans TC", sans-serif; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; }

  /* 5.1 頁首 */
  .page .head { font-family: "Noto Sans TC", sans-serif; font-size: 12.5px; line-height: 1.9; letter-spacing: .04em;
    color: var(--muted); text-align: center; padding: 0 0 16px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }

  /* 玩家輸入：靠右的旁註 */
  .aside { align-self: flex-end; width: auto !important; max-width: min(85%, 30em) !important; margin-right: 0 !important;
    background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
    font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }

  /* 5.3 通訊：嵌在書頁裡的手機畫面 */
  .im { font-family: "Noto Sans TC", sans-serif; letter-spacing: 0; line-height: 1.6;
    max-width: 22.5em; margin: 8px auto 26px; background: var(--phone); border: 1px solid var(--line);
    border-radius: 26px; padding: 10px 10px 14px; box-shadow: var(--shadow); }
  .im-top { text-align: center; padding: 6px 8px 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .im-top .who { font-size: 15px; font-weight: 700; color: var(--text); }
  .im-top .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .im-msgs { display: flex; flex-direction: column; gap: 8px; padding: 0 2px; }
  .im-row { display: flex; flex-direction: column; align-items: flex-start; max-width: 82%; }
  .im-row.me { align-self: flex-end; align-items: flex-end; }
  .im-row .name { font-size: 11px; color: var(--muted); margin: 0 6px 2px; }
  .im-row .bub { background: var(--bubble-them); border: 1px solid var(--line); border-radius: 16px 16px 16px 5px;
    padding: 8px 12px; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .im-row.me .bub { background: var(--bubble-me); color: var(--bubble-me-ink); border-color: transparent;
    border-radius: 16px 16px 5px 16px; }
  .im-row .time { font-size: 10.5px; color: var(--muted); margin: 2px 6px 0; }

  /* 5.4 音樂卡 */
  .song { font-family: "Noto Sans TC", sans-serif; font-size: 14px; line-height: 1.8; letter-spacing: 0;
    margin: 6px 0 24px; padding: 14px 16px 14px 18px; background: var(--panel); border-radius: 14px;
    border-left: 3px solid var(--accent); }
  .song a { font-weight: 700; text-decoration: none; }

  /* 5.2 狀態欄 */
  .tracker { font-family: "Noto Sans TC", sans-serif; font-size: 13.5px; line-height: 1.85; letter-spacing: 0;
    margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 10px; color: var(--muted); }
  .tracker summary { cursor: pointer; list-style: none; font-size: 12.5px; color: var(--muted); user-select: none; }
  .tracker summary::-webkit-details-marker { display: none; }
  .tracker summary::before { content: "▸ "; }
  .tracker[open] summary::before { content: "▾ "; }
  .tracker .lines { margin-top: 8px; color: var(--text); opacity: .88; white-space: pre-wrap; word-break: break-word; }

  .notice { font-size: 13.5px; text-align: center; color: var(--danger); }
  .marker { font-size: 12.5px; text-align: center; color: var(--muted); letter-spacing: .1em; }
  .typing { font-size: 13.5px; color: var(--muted); font-style: italic; }
  .usage { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: -14px !important; opacity: .8; }
  .empty { margin: auto !important; text-align: center; color: var(--muted); line-height: 2; max-width: 20em !important;
    font-family: "Noto Serif TC", serif; }

  footer { background: var(--bg); border-top: 1px solid var(--line); padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  footer > * { max-width: 40em; margin-left: auto; margin-right: auto; }
  .tools { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .tools button { font-size: 12.5px; padding: 5px 10px; background: transparent; color: var(--muted); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 14px; width: 100%; resize: none; line-height: 1.7; }
  #input { min-height: 46px; max-height: 40vh; }
  #send { padding: 11px 18px; border-radius: 14px; white-space: nowrap; flex-shrink: 0; }

  /* 面板 */
  .overlay { position: fixed; inset: 0; background: rgba(12, 8, 16, .55); display: none;
    align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet { background: var(--page); width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 22px 18px; padding-bottom: max(22px, env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 4px; font-family: "Noto Serif TC", serif; font-size: 20px; font-weight: 600; letter-spacing: .04em; }
  .sheet p.note { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.7; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > *:first-child { flex: 1; }
  #card { min-height: 120px; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 22px; }
  .sheet .actions button { flex: 1; padding: 12px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .status.err { color: var(--danger); }
  .charlist { display: flex; flex-direction: column; gap: 8px; }
  .charlist button { text-align: left; padding: 14px 16px; font-family: "Noto Serif TC", serif; font-size: 17px;
    background: var(--panel); }
  .charlist button.current { border-color: var(--accent); }
  .charlist button small.intro { color: var(--text); opacity: .82; font-size: 13px; line-height: 1.6; margin-top: 6px; }
  .charlist button small { display: block; font-family: "Noto Sans TC", sans-serif; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .slot { display: flex; gap: 6px; align-items: stretch; }
  .slot > button:first-child { flex: 1; min-width: 0; }
  .slot .mini { font-family: "Noto Sans TC", sans-serif; font-size: 12.5px; padding: 0 12px; background: transparent; color: var(--muted); }
  .slot .mini.del { color: var(--danger); }
  #slotNew { margin-top: 14px; }
  #slotNew[hidden] { display: none; }

  /* ☰ 選單 */
  #menuBtn { font-size: 22px; line-height: 1; padding: 6px 10px; }
  .menu-wrap { position: fixed; inset: 0; z-index: 20; display: none; }
  .menu-wrap.open { display: block; }
  .menu { position: absolute; right: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 46px);
    min-width: 220px; background: var(--page); border: 1px solid var(--line); border-radius: 16px;
    padding: 6px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .menu a, .menu button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    font: inherit; font-size: 15px; color: var(--text); text-decoration: none; background: transparent;
    border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .menu a:hover, .menu button:hover { background: var(--accent-soft); }
  .menu .ico { width: 1.4em; text-align: center; flex-shrink: 0; }
  .menu .ext { margin-left: auto; color: var(--muted); font-size: 12px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 8px; }

  /* 翻看列：最新一頁狀態欄下方 */
  .peek { font-family: "Noto Sans TC", sans-serif; letter-spacing: 0; margin-top: 12px; }
  .peek summary { cursor: pointer; list-style: none; font-size: 12.5px; color: var(--muted); user-select: none; }
  .peek summary::-webkit-details-marker { display: none; }
  .peek summary::before { content: "▸ "; }
  .peek[open] summary::before { content: "▾ "; }
  .peek summary .spark { color: var(--accent); margin-left: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font: inherit; font-size: 13.5px; line-height: 1.4; color: var(--text); background: var(--accent-soft);
    border: 1px solid var(--accent-line); border-radius: 999px; padding: 7px 14px 7px 11px;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .15s ease, background .15s ease; }
  .chip:hover { background: var(--panel-2); }
  .chip:active { transform: scale(.93); }

  /* 翻看卡：✦ 區塊 */
  .lore-card { position: relative; font-family: "Noto Sans TC", sans-serif; font-size: 14.5px; line-height: 1.85;
    letter-spacing: 0; margin: 18px 0 28px; padding: 18px 18px 16px; background: var(--panel);
    border: 1.5px dashed var(--accent-line); border-radius: 20px; box-shadow: var(--shadow); }
  .lore-card::before, .lore-card::after { position: absolute; color: var(--accent); background: var(--bg);
    padding: 0 6px; font-size: 13px; line-height: 1; }
  .lore-card::before { content: "✦"; top: -8px; left: 18px; }
  .lore-card::after { content: "✧ ✦"; bottom: -7px; right: 18px; letter-spacing: 2px; }
  .lore-sec + .lore-sec { border-top: 1px dotted var(--accent-line); margin-top: 12px; padding-top: 12px; }
  .lore-sec.title { text-align: center; }
  .lore-sec.title .lore-line:first-child { font-size: 16px; font-weight: 700; color: var(--text); }
  .lore-sec.title .lore-line + .lore-line { font-size: 12.5px; color: var(--muted); }
  .lore-line { white-space: pre-wrap; word-break: break-word; }
  .lore-line.lab { font-weight: 700; color: var(--accent); margin-top: 6px; }
  .lore-line.lab:first-child { margin-top: 0; }
  .lore-line.note { margin-top: 6px; }
  .lore-line.sub { padding-left: 1.1em; color: var(--text); opacity: .92; }
  .lore-line.sub::before { content: "◦ "; color: var(--accent); }
  .lore-line.floor { margin-top: 8px; font-weight: 600; }
  .lore-line.reply { padding-left: 1.1em; font-size: 13.5px; color: var(--muted); }
  .lore-line.gap { height: .6em; }
  .lore-card del { opacity: .55; text-decoration-color: var(--danger); }

  /* 翻看指令的標記、存檔標記 */
  .pill { align-self: center; width: fit-content !important; max-width: 92% !important; font-family: "Noto Sans TC", sans-serif;
    font-size: 12.5px; line-height: 1.6; color: var(--muted); text-align: center; border-radius: 999px; padding: 4px 14px; }
  .lore-mark { color: var(--accent); border: 1px dashed var(--accent-line); background: var(--accent-soft); }
  .lore-mark .extra { color: var(--muted); }
  .save-mark { margin-top: -8px !important; background: var(--accent-soft); }
  .save-mark.saving .dot { display: inline-block; animation: bob 1s ease-in-out infinite; }
  .save-mark.fail { color: var(--danger); background: transparent; border: 1px dashed var(--danger); cursor: pointer; }
  .win-hint { margin-top: -12px !important; color: var(--accent); border: 1px solid var(--accent-line); background: transparent;
    cursor: pointer; transition: transform .15s ease, background .15s ease; }
  .win-hint:hover { background: var(--accent-soft); }
  .win-hint:active { transform: scale(.96); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* 📦 匯出／匯入 */
  .io-list { display: flex; flex-direction: column; gap: 10px; }
  .io-list button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px;
    background: var(--panel); border-radius: 16px; transition: transform .15s ease; }
  .io-list button:active { transform: scale(.98); }
  .io-list .ico { font-size: 22px; width: 1.4em; text-align: center; flex-shrink: 0; }
  .io-list b { display: block; font-weight: 600; font-size: 15.5px; }
  .io-list small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.6; }
  .io-list small.slotinfo { color: var(--accent); }
  .io-list small.slotinfo:empty { display: none; }
  #ioCard { min-height: 96px; }
  #ioMem { min-height: 150px; }
  #ioForm[hidden], #ioMain[hidden] { display: none; }

  /* 📖 記憶庫面板 */
  .mem-block { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-top: 10px; }
  .mem-block.main { border: 1.5px dashed var(--accent-line); }
  .mem-block summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 12px 14px; font-size: 14.5px; font-weight: 600; user-select: none; }
  .mem-block summary::-webkit-details-marker { display: none; }
  .mem-block summary::before { content: "▸"; color: var(--muted); font-weight: 400; }
  .mem-block[open] summary::before { content: "▾"; }
  .mem-block summary .sub { font-size: 12px; font-weight: 400; color: var(--muted); }
  .mem-block summary .copy { margin-left: auto; font-size: 12.5px; font-weight: 400; padding: 4px 12px;
    border-radius: 999px; background: var(--accent-soft); border-color: var(--accent-line); }
  .mem-text { margin: 0 14px 14px; padding-top: 10px; border-top: 1px dotted var(--accent-line); font-size: 13.5px;
    line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
  .mem-head { font-size: 13px; color: var(--muted); margin: 18px 2px 0; }
  .mem-empty { text-align: center; color: var(--muted); font-size: 14px; line-height: 2; padding: 22px 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 120px); z-index: 30;
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    background: var(--page); color: var(--text); border: 1px solid var(--accent-line); border-radius: 999px;
    padding: 9px 18px; font-size: 13.5px; box-shadow: var(--shadow); width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .chip, .toast, .win-hint { transition: none; }
    .save-mark.saving .dot { animation: none; }
  }

  @media (min-width: 720px) {
    #chat { padding: 40px 24px 48px; }
    .page { font-size: 17.5px; }
    .overlay { align-items: center; }
    .sheet { border-radius: 22px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">mcx_purple</h1>
  <button class="ghost" id="menuBtn" aria-label="選單" aria-haspopup="true" aria-expanded="false">☰</button>
</header>

<div id="menu" class="menu-wrap">
  <nav class="menu" aria-label="選單">
    <button type="button" id="openChars"><span class="ico">👤</span>切換角色</button>
    <hr>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
// ============================================================
// 設定：把這裡換成妳的 Worker 網址
// ============================================================
const WORKER_URL = "https://rp.mcxpurple.workers.dev";

// ☰ 選單的外部連結：換網址只改這三行
const CHARS_URL = "https://obvious-tenor-7aa.notion.site/210f4e50bb4b80008d28edd7fbe3da7c";  // 角色們（單人）
const WORLDS_URL = "https://obvious-tenor-7aa.notion.site/2d1f4e50bb4b802d9c80e60a76446428"; // 開放世界（多人）
const GUIDE_URL = "https://obvious-tenor-7aa.notion.site/3f5f4e50bb4b81e184d4eed446634734";  // 使用說明

// 每幾頁自動寫入記憶庫一次（實測時可暫時改小，例如 2）
const SAVE_EVERY = 20;
// 這一窗寫入記憶庫滿幾頁後，提示玩家換窗接續
const WINDOW_EVERY = 40;
// 每輪送出的最近對話則數，需與 Worker 的 HISTORY_LIMIT 相同（玩家＋角色各算一則，40 則約 20 頁）
const HISTORY_LIMIT = 40;

// ---------- 儲存（包 try/catch，私密瀏覽等情況下不會壞掉）----------
const store = {
  get(k, fallback) {
    try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem(k); } catch {} },
};

let settings = store.get("rp_settings", { invite: "", key: "", model: "", character: "", characterName: "", provider: "" });

// 服務商：依 key 開頭判斷（AIza → Gemini、sk-ant- → Claude、sk-or- → OpenRouter）
// 其他 sk- 開頭 ChatGPT 與 DeepSeek 共用，回傳 "sk"，由玩家自己選
const PROVIDERS = { gemini: "Gemini", claude: "Claude", openai: "ChatGPT", deepseek: "DeepSeek", openrouter: "OpenRouter" };
const SK_PROVIDERS = ["openai", "deepseek"];
function detectProvider(key) {
  const k = String(key || "").trim();
  if (k.startsWith("sk-ant-")) return "claude";
  if (k.startsWith("sk-or-")) return "openrouter";
  if (k.startsWith("AIza")) return "gemini";
  if (k.startsWith("sk-")) return "sk";
  return "";
}
// key 與服務商是否相符
function keyFits(key, provider) {
  const d = detectProvider(key);
  if (!d) return true;
  return d === "sk" ? SK_PROVIDERS.includes(provider) : d === provider;
}
// 舊版設定沒有服務商欄位：依 key 補上，判斷不出來就當 Gemini
if (!PROVIDERS[settings.provider]) {
  const d = detectProvider(settings.key);
  settings.provider = d === "sk" ? "openai" : d || "gemini";
  store.set("rp_settings", settings);
}
// 存檔欄位：{ 角色id: { current: 存檔id, list: [{ id, name, card, updated, count }] } }
// 每個存檔的對話存在 rp_history_{角色id}__{存檔id}
let slots = store.get("rp_slots", {});
migrateOldData();

let history = [];
let busy = false;

const NEW_GAME = "/新玩家";
// 換窗、匯入記憶庫、從其他平台接續：第一句送 /舊玩家，附一行說明（畫面上不顯示）
const OLD_GAME = "/舊玩家";
const OLD_NOTE = "（角色卡與過往記憶已提供，請直接依記憶接續）";
const isOldGame = (t) => typeof t === "string" && t.startsWith(OLD_GAME);
const CARD_MARK = "【玩家角色卡】";

// 翻看指令清單（名稱、圖示、指令），由 Worker 的 /characters 提供，條目內容留在 Worker
let lorebook = store.get("rp_lore", []);
function setLore(list) {
  lorebook = Array.isArray(list) ? list : [];
  store.set("rp_lore", lorebook);
}
// 玩家輸入以指令開頭（後面接空白、換行或結尾）才算翻看
function loreOf(text) {
  const msg = String(text || "").trim();
  const low = msg.toLowerCase();
  for (const e of lorebook) {
    for (const k of e.keys || []) {
      const kl = k.toLowerCase();
      if (low === kl || (low.startsWith(kl) && /\s/.test(low.charAt(kl.length)))) {
        return { entry: e, rest: msg.slice(k.length).trim() };
      }
    }
  }
  return null;
}

// 舊版「一個角色一張卡、一段對話」→ 轉成各角色的「存檔 1」
function migrateOldData() {
  if (store.get("rp_slots_v", 0) >= 1) return;
  const oldCards = store.get("rp_cards", {});
  if (settings.card && settings.character && !oldCards[settings.character]) oldCards[settings.character] = settings.card;
  const ids = new Set(Object.keys(oldCards));
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const m = localStorage.key(i).match(/^rp_history_(.+)$/);
      if (m && !m[1].includes("__") && m[1] !== "none") ids.add(m[1]);
    }
  } catch {}
  for (const cid of ids) {
    if (slots[cid]) continue;
    const h = store.get(`rp_history_${cid}`, []);
    slots[cid] = { current: "s1", list: [{ id: "s1", name: "存檔 1", card: oldCards[cid] || "", updated: Date.now(), count: h.length }] };
    store.set(`rp_history_${cid}__s1`, h);
    store.remove(`rp_history_${cid}`);
  }
  store.set("rp_slots", slots);
  store.remove("rp_cards");
  store.remove("rp_history_none");
  delete settings.card;
  store.set("rp_settings", settings);
  store.set("rp_slots_v", 1);
}

function saveSlots() { store.set("rp_slots", slots); }
function charSlots(cid) { return slots[cid] || (slots[cid] = { current: "", list: [] }); }
function slotOf(cid) {
  const cs = slots[cid];
  return (cs && cs.list.find((s) => s.id === cs.current)) || null;
}
function curSlot() { return settings.character ? slotOf(settings.character) : null; }
function newSlot(cid, name) {
  const cs = charSlots(cid);
  const s = { id: Date.now().toString(36), name: name || `存檔 ${cs.list.length + 1}`, card: "", updated: Date.now(), count: 0 };
  cs.list.push(s);
  cs.current = s.id;
  saveSlots();
  return s;
}
// 角色沒有存檔時自動補一個，確保永遠有地方存
function ensureSlot(cid) {
  if (!cid) return null;
  const cs = charSlots(cid);
  if (!cs.list.some((s) => s.id === cs.current)) {
    if (cs.list.length) { cs.current = cs.list[0].id; saveSlots(); }
    else newSlot(cid);
  }
  return slotOf(cid);
}

function currentCard() { const s = curSlot(); return (s && s.card) || ""; }
function setCard(text) {
  const s = curSlot();
  if (!s) return;
  s.card = text || "";
  saveSlots();
}

const $ = (id) => document.getElementById(id);
const chatEl = $("chat");

function historyKey(cid = settings.character, sid) {
  if (sid === undefined) { const s = slotOf(cid); sid = s ? s.id : ""; }
  return `rp_history_${cid}__${sid}`;
}
function loadHistory() {
  const s = curSlot();
  history = s ? store.get(historyKey(), []) : [];
  if (!s) return;
  // 舊存檔沒有頁碼：依角色回覆順序補上，並校正頁首（不更動最後遊玩時間）
  const r = numberPages(history, s.base || 0);
  if (r.changed) store.set(historyKey(), history);
  if (s.pages !== r.pages) { s.pages = r.pages; saveSlots(); }
  // 舊存檔漏存角色卡：從對話紀錄補回
  if (!s.card) {
    const c = findCardInHistory(history);
    if (c) { s.card = c; saveSlots(); }
  }
}
function saveHistory() {
  const s = curSlot();
  if (!s) return;
  s.pages = numberPages(history, s.base || 0).pages;
  store.set(historyKey(), history);
  s.updated = Date.now();
  s.count = history.length;
  saveSlots();
}

// ---------- 頁數 ----------
// 一則角色回覆＝一頁；/新玩家 之後的第一則（登場）就是 page.1
// 重來最後一則：舊回覆移除後新回覆補回同一個位置，頁碼自然沿用
// base：換窗、匯入記憶庫或從其他平台接續時的起始頁（例如上一窗存到 Page.76，這裡就是 76）
function numberPages(list, base = 0) {
  let n = base, changed = false;
  for (const m of list) {
    if (m.role === "user" && m.text === NEW_GAME) n = 0;
    if (m.role !== "model") continue;
    n++;
    if (m.page !== n) { m.page = n; changed = true; }
    const fixed = fixHeadPage(m.text, n);
    if (fixed !== m.text) { m.text = fixed; changed = true; }
  }
  return { pages: n, changed };
}

// 把 5.1 頁首（開頭最多 3 行帶「｜」的行）裡的 page.X 改成程式計數；沒有 page 欄就原樣保留
function fixHeadPage(text, n) {
  if (typeof text !== "string") return text;
  const lines = text.split("\n");
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  for (let k = i; k < Math.min(i + 3, lines.length) && lines[k].includes("｜"); k++) {
    const re = /(page\s*[.．:：]?\s*)\d+/i;
    if (re.test(lines[k])) {
      lines[k] = lines[k].replace(re, `$1${n}`);
      return lines.join("\n");
    }
  }
  return text;
}

function slotPages(cid, s) {
  if (typeof s.pages === "number") return s.pages;
  return numberPages(store.get(historyKey(cid, s.id), []), s.base || 0).pages;
}

// ---------- 記憶庫：每個存檔各自保存記憶片段 ----------
// rp_memory_{角色id}__{存檔id} = { saved: 已寫入到第幾頁, epoch: 開新遊戲就 +1, frags: [{ from, to, date, text, at }] }
function memKey(cid, sid) { return `rp_memory_${cid}__${sid}`; }
function loadMem(cid = settings.character, sid = (curSlot() || {}).id) {
  const m = store.get(memKey(cid, sid), null);
  return m && Array.isArray(m.frags) ? m : { saved: 0, epoch: 0, frags: [] };
}
function saveMem(cid, sid, m) { store.set(memKey(cid, sid), m); }

const EVT_RE = /^\s*\[EVT\.(\d+)\s*[｜|]\s*([SABC])\s*\]\s*(.+?)\s*$/;
// 從記憶片段擷取 [EVT.xx｜權重] 事件標題（同一編號只取一次）
function fragEvts(text) {
  const seen = new Map();
  for (const l of String(text).split("\n")) {
    const m = l.match(EVT_RE);
    if (m && !seen.has(+m[1])) seen.set(+m[1], `[EVT.${m[1]}｜${m[2]}] ${m[3]}`);
  }
  return [...seen.entries()].sort((a, b) => a[0] - b[0]);
}
function fragLabel(f) {
  if (f.imported) return f.to ? `Page.1-${f.to}（其他平台匯入）` : "其他平台匯入";
  return `Page.${f.from}-${f.to}`;
}
function nextEvt(mem) {
  let max = 0;
  for (const f of mem.frags) for (const [n] of fragEvts(f.text)) max = Math.max(max, n);
  return max + 1;
}

// 常駐記憶檔由程式組裝：事件總目錄逐份累加＋最新片段的「當前狀態總結」到結尾
function buildMemory(mem, slotName = (curSlot() || {}).name || "") {
  if (!mem.frags.length) return "";
  const char = settings.characterName || "角色";
  const user = playerName() || "玩家";
  const out = [
    `【${char}×${user}｜${slotName}｜常駐記憶檔】`,
    `玩家名稱｜${user}｜記錄角色｜${char}`,
    "━ 事件總目錄 ━ # 權重：S=核心劇情 / A=重要事件 / B=一般過渡 / C=瑣碎細節",
  ];
  for (const f of mem.frags) {
    out.push(fragLabel(f) + `｜${f.date || ""}`);
    for (const [, t] of fragEvts(f.text)) out.push(t);
  }
  const last = mem.frags[mem.frags.length - 1].text;
  // 最新一份片段的情感記憶層（A-2 多角色時含每位角色的情感層），避免感情斷層
  const emo = emotionLayer(last);
  if (emo) out.push(emo);
  const i = last.indexOf("當前狀態總結");
  out.push(i >= 0 ? last.slice(i).trim() : last.trim());
  return out.join("\n");
}

// 情感層：從第一個「━…情感…━」標題，到「世界狀態層」標題之前
function emotionLayer(text) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  const a = lines.findIndex((l) => /^\s*━.*情感/.test(l));
  if (a < 0) return "";
  let b = lines.findIndex((l, k) => k > a && /世界狀態層/.test(l));
  if (b < 0) b = lines.findIndex((l, k) => k > a && /當前狀態總結/.test(l));
  return lines.slice(a, b < 0 ? lines.length : b).join("\n").trim();
}

// 換窗後第一輪：全部記憶片段依時間先後完整附上（之後改用 EVT 回查翻閱）
function allFragsText(mem) {
  if (!mem.frags.length) return "";
  const body = mem.frags.map((f) => `【${fragLabel(f)}｜記憶片段】\n${String(f.text).trim()}`).join("\n\n━━━━━━━━\n\n");
  return "以下為全部記憶片段，依時間先後排列；現況以常駐記憶檔為準，記憶片段保存事件細節與原話。\n\n" + body;
}

// 劇情日期區間：從這幾頁 5.1 頁首抓日期，例：2026.10.04 或 2026.10.04-10.05
function storyDates(list) {
  const ds = [];
  for (const m of list) {
    if (m.role !== "model") continue;
    const head = String(m.text).split("\n").slice(0, 4).join("\n");
    const d = head.match(/(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
    if (d) ds.push(`${d[1]}.${d[2].padStart(2, "0")}.${d[3].padStart(2, "0")}`);
  }
  if (!ds.length) return "";
  ds.sort();
  const a = ds[0], b = ds[ds.length - 1];
  return a === b ? a : a.slice(0, 4) === b.slice(0, 4) ? `${a}-${b.slice(5)}` : `${a}-${b}`;
}

// ---------- EVT 回查 ----------
// 把全部記憶片段的事件逐筆建索引：編號、權重、標題、完整內容、關鍵詞、相關事件、頁數
function evtIndex(mem) {
  const map = new Map();
  for (const f of mem.frags) {
    const lines = String(f.text).replace(/\r/g, "").split("\n");
    let cur = null;
    const close = () => {
      if (!cur) return;
      const body = cur.lines.join("\n").replace(/\s+$/, "");
      const kw = (body.match(/關鍵詞[:：]\s*(.+)/) || [])[1] || "";
      const rel = (body.match(/相關事件[:：]\s*(.*)/) || [])[1] || "";
      const pg = body.match(/\(P\.?\s*(\d+)(?:\s*[-–~～]\s*P?\.?\s*(\d+))?\)/);
      const evt = {
        num: cur.num,
        head: cur.head,
        body,
        keys: kw.split(/[,，、;；]/).map((s) => s.trim()).filter((s) => s.length >= 2),
        related: [...rel.matchAll(/EVT\.?\s*(\d+)/gi)].map((m) => +m[1]),
        pageTo: pg ? +(pg[2] || pg[1]) : f.to || 0,
      };
      const old = map.get(evt.num);
      if (!old || evt.body.length > old.body.length) map.set(evt.num, evt);
      cur = null;
    };
    for (const l of lines) {
      const m = l.match(EVT_RE);
      if (m) { close(); cur = { num: +m[1], head: `[EVT.${m[1]}｜${m[2]}] ${m[3]}`, lines: [l.trim()] }; continue; }
      if (cur && (/^\s*(當前狀態總結|━)/.test(l) || /^\s*\(事件多時/.test(l))) { close(); continue; }
      if (cur) cur.lines.push(l);
    }
    close();
  }
  return map;
}

// 比對玩家這一句＋角色上一則，命中關鍵詞或直接寫 EVT 編號；再順著「相關事件」一路帶出去
// 還在這次送出的對話紀錄裡的事件不重複附（但仍會順著它的相關事件往前找）
function recallText(mem, message, lastReply, windowStart) {
  const idx = evtIndex(mem);
  if (!idx.size) return "";
  const src = `${message}\n${lastReply}`.toLowerCase();
  const hit = new Set();
  for (const e of idx.values()) {
    if (e.keys.some((k) => src.includes(k.toLowerCase()))) hit.add(e.num);
  }
  for (const m of src.matchAll(/evt\.?\s*(\d+)/g)) if (idx.has(+m[1])) hit.add(+m[1]);
  const all = new Set();
  const walk = (n) => {
    if (all.has(n) || !idx.has(n)) return;
    all.add(n);
    for (const r of idx.get(n).related) walk(r);
  };
  hit.forEach(walk);
  const picked = [...all]
    .sort((a, b) => a - b)
    .map((n) => idx.get(n))
    .filter((e) => !(windowStart && e.pageTo >= windowStart));
  if (!picked.length) return "";
  return "以下為本輪提及之過往事件與其相關事件，供承接因果與原話；現況以常駐記憶檔為準。\n\n" + picked.map((e) => e.body).join("\n\n");
}

// 取出 Page.from-to 的對話原文（含引出第一頁的那句玩家訊息）
function sliceTranscript(list, from, to) {
  const idx = [];
  list.forEach((m, i) => { if (m.role === "model" && m.page >= from && m.page <= to) idx.push(i); });
  if (!idx.length) return [];
  let a = idx[0];
  if (a > 0 && list[a - 1].role === "user") a--;
  return list
    .slice(a, idx[idx.length - 1] + 1)
    .filter((m) => !(m.role === "user" && m.text === NEW_GAME))
    .map(({ role, text, page }) => ({ role, text, page }));
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

// ---------- 把角色回覆排成小說頁 ----------
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 只處理粗體、刪除線與連結，其餘一律當純文字
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// Markdown：正文交給 marked（cdnjs）；回覆夾帶的 HTML 一律當文字顯示，連結只放行 http(s)，圖片只顯示說明文字
// marked 沒載入時退回 inline() 的簡易版
const md = window.marked && window.marked.Marked ? new window.marked.Marked({ gfm: true, breaks: true }) : null;
if (md) {
  md.use({
    renderer: {
      html(h) { return esc(typeof h === "string" ? h : (h && h.text) || ""); },
      link(href, title, text) {
        return /^https?:\/\//i.test(href || "") ? `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>` : text;
      },
      image(href, title, text) { return esc(text || ""); },
    },
  });
}

function renderMarkdown(text, page) {
  if (!text.trim()) return;
  if (!md) {
    text.split(/\n\s*\n/).forEach((chunk) => {
      if (!chunk.trim()) return;
      const p = document.createElement("p");
      p.innerHTML = chunk.split("\n").map((l) => inline(l.trim())).join("<br>");
      page.append(p);
    });
    return;
  }
  const box = document.createElement("div");
  box.innerHTML = md.parse(text);
  // 表格可左右捲動
  box.querySelectorAll("table").forEach((t) => {
    const w = document.createElement("div");
    w.className = "tbl";
    t.replaceWith(w);
    w.append(t);
  });
  // 程式碼框（例如 ```text 包住的角色卡）：加「填入」「複製」
  box.querySelectorAll("pre").forEach((pre) => {
    const code = pre.textContent.replace(/\n$/, "");
    const card = document.createElement("div");
    card.className = "codecard";
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("button");
    fill.type = "button";
    fill.textContent = "填入";
    fill.onclick = () => {
      const inp = $("input");
      inp.value = code;
      autoGrow();
      inp.focus();
    };
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "複製";
    copy.onclick = async () => {
      await copyText(code);
      copy.textContent = "已複製";
      setTimeout(() => (copy.textContent = "複製"), 1500);
    };
    bar.append(fill, copy);
    pre.replaceWith(card);
    card.append(pre, bar);
  });
  page.append(...box.childNodes);
}

// 從玩家角色卡讀出名字，不限寫法：
//   標籤（名字／姓名／名稱／Name）→ 自我介紹句（我叫／我是／叫我）→ 第一段第一格 → 記憶片段裡的「玩家名稱」
function playerName(card = currentCard()) {
  const SEP = /[｜|│┃丨／\/,，、;；。\n]/;
  const clean = (x) =>
    x.replace(/（.*?）|\(.*?\)|「|」|『|』|\*\*/g, "").replace(/^[\s\-•*・◦#>：:｜|＝=]+/, "").replace(/(就好|就可以|就行|吧|喔|哦|啦)$/, "").trim();
  const ok = (x) => (x && x.length <= 12 && !/^(性別|年齡|生日|身高|外貌|職業|女|男)$/.test(x) ? x : "");
  if (card) {
    card = card.replace(/\*\*/g, "");
    // 1. 標籤
    const m = card.match(/(?:名字|姓名|名稱|稱呼|name)\s*(?:是|叫|為)?\s*[：:｜|＝=]?\s*([^\n]+)/i);
    if (m) { const v = ok(clean(m[1].split(SEP)[0])); if (v) return v; }
    // 2. 自我介紹句
    const intro = card.match(/(?:我叫|我是|叫我|名叫|本名)\s*([^\s，,。.、｜|：:！!？?（(\n]{1,12})/);
    if (intro) { const v = ok(clean(intro[1])); if (v) return v; }
    // 3. 「玩家角色卡」標題之後（沒有標題就從頭）第一段的第一格
    const h = card.match(/【?玩家角色卡】?\s*[：:]?/);
    const rest = h ? card.slice(h.index + h[0].length) : card;
    const first = rest.split("\n").map((l) => l.trim()).find(Boolean) || "";
    const v = ok(clean(first.split(SEP)[0]));
    if (v) return v;
  }
  // 4. 記憶片段裡模型寫下的玩家名稱
  try {
    const frags = curSlot() ? loadMem().frags : [];
    for (let i = frags.length - 1; i >= 0; i--) {
      const t = String(frags[i].text);
      const a = t.match(/玩家名稱｜([^｜\n]+)/);
      if (a && a[1].trim() && a[1].trim() !== "玩家") return a[1].trim();
      const b = t.match(/玩家（([^）]{1,12})）/);
      if (b) return b[1].trim();
    }
  } catch {}
  return "";
}

// 玩家在聊天中送出的是不是角色卡：開頭是「玩家角色卡」，而且後面有分隔或換行
// 角色剛請玩家填角色卡（上一則提到「角色卡」），且這個存檔還沒有卡：玩家接著送出的那一則就是角色卡，不論格式
function isCardReply(msg, prevModelText) {
  const t = String(msg || "").trim();
  return !currentCard() && /角色卡/.test(prevModelText || "") && !t.startsWith("/") && t.length >= 8;
}
// 舊存檔補救：從對話紀錄找出「角色請填卡 → 玩家回覆」的那一則
function findCardInHistory(list) {
  for (let i = 1; i < list.length; i++) {
    const m = list[i];
    if (m.role !== "user" || m.text.startsWith("/")) continue;
    if (m.text.includes(CARD_MARK) || isCardMessage(m.text)) return m.text;
    const prev = list[i - 1];
    if (prev.role === "model" && /角色卡/.test(prev.text) && m.text.trim().length >= 8) return m.text;
  }
  return "";
}

function isCardMessage(msg) {
  return /^\s*【?玩家角色卡】?\s*[：:]?[\s\S]*[｜|\n]/.test(msg) && /^\s*【?玩家角色卡/.test(msg);
}

// 小幫手的裝飾框線（◆‧₊˚ … ◆）與單純分隔線（*** 或 ---）
function isFrameLine(l) { return /^\s*[◆◇]/.test(l) || isRuleLine(l); }
function isRuleLine(l) { return /^\s*(\*{3,}|-{3,}|＊{3,})\s*$/.test(l); }

// 結尾記號比對：去掉空白與變體符號後取開頭（與 Worker 的 tailKey 相同規則）
function tailKey(line) {
  return String(line).split("{")[0].replace(/[\s️]/g, "");
}
const tailMarks = store.get("rp_tail", {});

function isTrackerLine(l) {
  return /｜/.test(l) || /^\s*(·|⊱|✦|🧨|㊙️)/.test(l) || /行動建議/.test(l);
}

function renderPage(text, latest) {
  const page = document.createElement("article");
  page.className = "page";
  const lines = text.replace(/\r/g, "").split("\n");

  let start = 0;
  while (start < lines.length && !lines[start].trim()) start++;

  // 5.1 頁首：開頭連續幾行帶「｜」、且其中一行有 page
  let headEnd = start;
  while (headEnd < lines.length && headEnd - start < 3 && lines[headEnd].includes("｜")) headEnd++;
  const headLines = lines.slice(start, headEnd);
  if (headLines.length >= 2 && headLines.some((l) => /page/i.test(l))) {
    const h = document.createElement("div");
    h.className = "head";
    h.innerHTML = headLines.map((l) => inline(l.trim())).join("<br>");
    page.append(h);
    start = headEnd;
  }

  // 5.2 狀態欄：先用後台的結尾記號（Worker 從最後一個「格式如下」算出來）
  // 從上往下找第一個同樣開頭、而且從那行到結尾都沒有長段落（不含「｜」超過 60 字＝正文）的行，從那行收起
  let end = lines.length;
  const mark = tailMarks[settings.character] || "";
  const isProse = (l) => !l.includes("｜") && [...l.trim()].length > 60;
  let m = -1;
  if (mark) {
    for (let i = start; i < lines.length; i++) {
      if (tailKey(lines[i]).startsWith(mark) && !lines.slice(i).some(isProse)) { m = i; break; }
    }
  }
  if (m >= 0) {
    // 整頁都是結算格式（例如深夜存檔頁）→ 不收合，整頁照常顯示
    if (lines.slice(start, m).some((l) => l.trim())) end = m;
  } else {
    let j = lines.length - 1;
    while (j >= start && (!lines[j].trim() || isTrackerLine(lines[j]))) j--;
    const tail = lines.slice(j + 1);
    if (tail.some((l) => l.includes("｜"))) end = j + 1;

    // 5.2 的小幫手區塊（◆ 框線包起來，或 *** 分隔線之後）緊接在狀態行前面時，一起收進狀態
    if (end < lines.length) {
      let k = end - 1;
      while (k >= start && !lines[k].trim()) k--;
      if (k >= start && isFrameLine(lines[k])) {
        if (isRuleLine(lines[k])) end = k;
        else {
          let o = k - 1;
          while (o >= start && !isFrameLine(lines[o])) o--;
          end = o >= start && !isRuleLine(lines[o]) ? o : k;
        }
      }
    }
  }

  // 中間：小說正文（Markdown）、5.3 通訊、5.4 音樂卡、翻看卡
  let buf = [];
  let fence = false;
  const flush = () => {
    renderMarkdown(buf.join("\n"), page);
    buf = [];
  };

  for (let i = start; i < end; i++) {
    const l = lines[i];
    const t = l.trim();
    // 程式碼框裡的內容原樣保留，不判斷其他格式
    if (/^(```|~~~)/.test(t)) { fence = !fence; buf.push(t); continue; }
    if (fence) { buf.push(l); continue; }
    if (t.startsWith("✧✦")) {
      flush();
      const block = [];
      i++;
      while (i < end && !lines[i].trim().startsWith("✧✦")) block.push(lines[i++]);
      page.append(renderIM(block));
    } else if (t.startsWith("╭")) {
      flush();
      const block = [];
      i++;
      while (i < end && !lines[i].trim().startsWith("╰")) block.push(lines[i++]);
      page.append(renderSong(block));
    } else if (isLoreSep(t)) {
      // 翻看卡：第一條到最後一條「✦ ─」分隔線之間
      flush();
      let last = i;
      for (let k = i + 1; k < end; k++) if (isLoreSep(lines[k].trim())) last = k;
      const stop = loreCommentsEnd(lines, last + 1, end);
      page.append(renderLoreCard(lines.slice(i, stop)));
      i = stop - 1;
    } else if (isRuleLine(t)) {
      // 分隔線前面補空行，避免上一行被當成標題
      buf.push("", "---", "");
    } else {
      // 去掉行首空白：避免縮排被當成程式碼框
      buf.push(t);
    }
  }
  if (fence) buf.push("```");
  flush();

  if (end < lines.length) {
    const det = document.createElement("details");
    det.className = "tracker";
    if (latest) det.open = true;
    const sum = document.createElement("summary");
    sum.textContent = "狀態";
    const box = document.createElement("div");
    box.className = "lines";
    box.innerHTML = lines
      .slice(end)
      .filter((l) => !isRuleLine(l))
      .join("\n")
      .trim()
      .split("\n")
      .map(inline)
      .join("\n");
    det.append(sum, box);
    page.append(det);
  }

  // 翻看列：只放在最新一頁
  if (latest && lorebook.length) page.append(renderPeek());
  return page;
}

// ---------- 翻看 ----------
function isLoreSep(t) { return /^✦\s*─/.test(t); }

// 論壇留言（💬 之後的 ▸ 樓層與 ▾ 樓主回覆）接在最後一條分隔線後面，一起收進卡片
function loreCommentsEnd(lines, start, end) {
  let k = start;
  while (k < end && !lines[k].trim()) k++;
  if (k >= end || !/^💬/.test(lines[k].trim())) return start;
  let stop = k;
  while (stop < end) {
    const raw = lines[stop];
    const t = raw.trim();
    if (!t) {
      let n = stop + 1;
      while (n < end && !lines[n].trim()) n++;
      if (n < end && /^[▸▾]/.test(lines[n].trim())) { stop = n; continue; }
      break;
    }
    if (/^[▸▾💬]/.test(t) || /^[\s　]/.test(raw)) { stop++; continue; }
    break;
  }
  return stop;
}

function renderLoreCard(block) {
  const card = document.createElement("div");
  card.className = "lore-card";
  const secs = [[]];
  for (const l of block) {
    if (isLoreSep(l.trim())) { if (secs[secs.length - 1].length) secs.push([]); }
    else secs[secs.length - 1].push(l);
  }
  secs.filter((s) => s.some((l) => l.trim())).forEach((sec, n) => {
    const box = document.createElement("div");
    box.className = "lore-sec" + (n === 0 ? " title" : "");
    // 去掉區段頭尾空行
    while (sec.length && !sec[0].trim()) sec.shift();
    while (sec.length && !sec[sec.length - 1].trim()) sec.pop();
    sec.forEach((raw, idx) => {
      const t = raw.trim();
      const next = (sec.slice(idx + 1).find((l) => l.trim()) || "").trim();
      const line = document.createElement("div");
      let cls = "lore-line";
      let body = t;
      // 「🗑️｜文字」→ 圖示＋文字；短的視為小標題（已刪除、待辦…），長的是內容（日記的 🩹、🔒）
      const em = t.match(/^([^\s｜]{1,3})｜\s*(.*)$/);
      if (!t) cls += " gap";
      else if (/^└/.test(t)) { cls += " sub"; body = t.replace(/^└\s*/, ""); }
      else if (/^▸/.test(t)) cls += " floor";
      else if (/^▾/.test(t) || (/^[\s　]{2,}/.test(raw) && n > 0)) cls += " reply";
      else if (em) {
        body = `${em[1]} ${em[2]}`;
        if (n > 0 && em[2].replace(/\s/g, "").length <= 10 && /^└/.test(next)) cls += " lab";
        else if (n > 0) cls += " note";
      }
      line.className = cls;
      line.innerHTML = inline(body);
      box.append(line);
    });
    card.append(box);
  });
  return card;
}

// ---------- 記憶庫寫入標記 ----------
let saving = null;   // 進行中的寫入 { cid, sid, from, to }
let saveFail = null; // 最近一次失敗 { cid, sid, to, msg }

function sameSlot(job) {
  const s = curSlot();
  return job && s && job.cid === settings.character && job.sid === s.id;
}

function showSaveMark(to, state, text) {
  chatEl.querySelectorAll(`.save-mark[data-to="${to}"]`).forEach((x) => x.remove());
  const pageEl = chatEl.querySelector(`.page[data-page="${to}"]`);
  if (!pageEl) return;
  const anchor = pageEl.nextElementSibling && pageEl.nextElementSibling.classList.contains("usage") ? pageEl.nextElementSibling : pageEl;
  const m = document.createElement("div");
  m.className = `pill save-mark ${state}`;
  m.dataset.to = to;
  if (state === "saving") m.innerHTML = `<span class="dot">📝</span> 正在寫入記憶庫 ${esc(text)}…`;
  else if (state === "fail") { m.textContent = `⚠︎ ${text} 寫入記憶庫失敗・點這裡重試`; m.onclick = () => runSave(true); m.setAttribute("role", "button"); }
  else m.textContent = `📝 已寫入記憶庫 ${text} ✧`;
  anchor.after(m);
}

// 這一窗寫入記憶庫滿 WINDOW_EVERY 頁：在最新的寫入標記下方提示換窗，點了直接換窗
function windowDue() {
  const s = curSlot();
  if (!s) return false;
  return loadMem().saved - (s.base || 0) >= WINDOW_EVERY;
}
function showWindowHint() {
  chatEl.querySelectorAll(".win-hint").forEach((x) => x.remove());
  if (!windowDue()) return;
  const mark = chatEl.querySelector(`.save-mark.done[data-to="${loadMem().saved}"]`);

  h.onclick = () => newWindow();
  h.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); newWindow(); } };
  mark.after(h);
}

function renderSaveMarks() {
  if (!curSlot()) return;
  for (const f of loadMem().frags) if (!f.imported) showSaveMark(f.to, "done", `Page.${f.from}-${f.to}`);
  if (sameSlot(saving)) showSaveMark(saving.to, "saving", `Page.${saving.from}-${saving.to}`);
  if (sameSlot(saveFail)) showSaveMark(saveFail.to, "fail", `Page.${saveFail.from}-${saveFail.to}`);
  showWindowHint();
}

let toastTimer;

  const t = $("toast");

// 把目前存檔尚未寫入的頁數整理成一份記憶片段；回傳 true＝已寫入或沒有要寫入的
async function runSave(manual = false) {
  const s = curSlot();
  if (!s) return false;
  if (saving) { if (manual) toast("記憶庫正在寫入，請稍等一下"); return false; }
  const cid = settings.character;
  const sid = s.id;
  const mem = loadMem(cid, sid);
  const from = mem.saved + 1;
  const to = s.pages || 0;
  if (to < from) { if (manual) toast("目前沒有新的頁面需要寫入記憶庫"); return true; }
  const transcript = sliceTranscript(history, from, to);
  if (!transcript.length) return true;

  const job = { cid, sid, from, to, epoch: mem.epoch || 0 };
  saving = job;
  if (sameSlot(saveFail) && saveFail.to <= to) saveFail = null;
  showSaveMark(to, "saving", `Page.${from}-${to}`);
  try {
    const data = await callWorker("/save", {
      key: settings.key,
      model: settings.model,
      character: cid,
      from,
      to,
      evtStart: nextEvt(mem),
      playerName: playerName(),
      characterName: settings.characterName,
      slotName: s.name,
      date: today(),
      transcript,
      memory: buildMemory(mem, s.name),
    });
    // 寫入期間若開了新遊戲或回捲，這份結果就作廢
    const now = loadMem(cid, sid);
    if ((now.epoch || 0) !== job.epoch || now.saved !== from - 1) return false;
    now.frags.push({ from, to, date: today(), story: storyDates(transcript), text: data.text, at: Date.now() });
    now.saved = to;
    saveMem(cid, sid, now);
    if (sameSlot(job)) {
      showSaveMark(to, "done", `Page.${from}-${to}`);
      showWindowHint();
      if (windowDue()) toast(`已寫入記憶庫 Page.${from}-${to}・建議換窗接續 🪟`);
      else if (manual) toast(`已寫入記憶庫 Page.${from}-${to} ✧`);
    }
    return true;
  } catch (e) {
    saveFail = { cid, sid, from, to, msg: e.message };
    if (sameSlot(job)) { showSaveMark(to, "fail", `Page.${from}-${to}`); toast(`寫入記憶庫失敗：${e.message}`); }
    return false;
  } finally {
    saving = null;
  }
}

function renderIM(block) {
  const wrap = document.createElement("div");
  wrap.className = "im";
  let sep = block.findIndex((l) => /^\s*✧\s*─/.test(l));
  if (sep < 0) sep = Math.min(2, block.length);
  const meta = block.slice(0, sep).map((l) => l.trim()).filter(Boolean);
  const msgs = block.slice(sep + (block[sep] && /✧/.test(block[sep]) ? 1 : 0)).filter((l) => l.trim());

  const top = document.createElement("div");
  top.className = "im-top";
  const who = meta.find((l) => l.startsWith("👤"));
  const info = meta.filter((l) => l !== who);
  top.innerHTML =
    `<div class="who">${inline((who || "訊息").replace(/^👤\s*/, ""))}</div>` +
    (info.length ? `<div class="meta">${info.map(inline).join("<br>")}</div>` : "");
  wrap.append(top);

  const list = document.createElement("div");
  list.className = "im-msgs";
  const me = playerName();
  for (const raw of msgs) {
    const m = raw.trim().match(/^([^:：]{1,24})[:：]\s*(.*)$/);
    let speaker = m ? m[1].trim() : "";
    let body = m ? m[2] : raw.trim();
    let time = "";
    const tm = body.match(/^(.*?)[\s　]+(\d{1,2}:\d{2})\s*$/);
    if (tm) { body = tm[1]; time = tm[2]; }

    const row = document.createElement("div");
    row.className = "im-row" + (me && speaker && (speaker.includes(me) || me.includes(speaker)) ? " me" : "");
    if (speaker) {
      const n = document.createElement("div");
      n.className = "name";
      n.textContent = speaker;
      row.append(n);
    }
    const b = document.createElement("div");
    b.className = "bub";
    b.innerHTML = inline(body);
    row.append(b);
    if (time) {
      const t = document.createElement("div");
      t.className = "time";
      t.textContent = time;
      row.append(t);
    }
    list.append(row);
  }
  wrap.append(list);
  return wrap;
}

function renderSong(block) {
  const d = document.createElement("div");
  d.className = "song";
  d.innerHTML = block
    .map((l) => l.trim())

// 每則回覆下方顯示這一輪的 token 用量
function fmt(n) {
  if (!n) return "0";
  if (n >= 10000) return (n / 10000).toFixed(1) + " 萬";
  if (n >= 1000) return (n / 1000).toFixed(1) + " 千";
  return String(n);
}
function usageText(u) {
  if (!u) return "";
  const parts = [`輸入 ${fmt(u.promptTokenCount)}`];
  if (u.cachedContentTokenCount) parts.push(`其中快取 ${fmt(u.cachedContentTokenCount)}`);
  parts.push(`輸出 ${fmt(u.candidatesTokenCount)}`);
  if (u.thoughtsTokenCount) parts.push(`思考 ${fmt(u.thoughtsTokenCount)}`);
  return parts.join("・") + " token";
}

// ---------- 呼叫 Worker ----------
async function callWorker(path, payload) {
  const res = await fetch(WORKER_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ invite: settings.invite, provider: settings.provider, ...payload }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `連線失敗（${res.status}）`);
  return data;
}

function ready() {
  if (!settings.invite || !settings.key || !settings.model || !settings.character) {
    openSettings("請先完成設定");
    return false;
  }
  if (!curSlot()) { ensureSlot(settings.character); loadHistory(); render(); }
  return true;
}

async function send(text, { addUser = true } = {}) {
  if (busy || !ready()) return;
  const message = text.trim();
  if (!message) return;

  const prior = history.slice();
  if (addUser) {
    history.push({ role: "user", text: message });
    saveHistory();
    addBubble("user", message);
  }

  // 玩家在聊天中送出角色卡 → 自動存成這個存檔的卡
  const prevModel = [...prior].reverse().find((m) => m.role === "model");
  if (message.includes(CARD_MARK) || isCardMessage(message) || isCardReply(message, prevModel && prevModel.text)) {
    setCard(message);
    $("pasteCard").hidden = false;
  }

  // 開始新遊戲那一輪不帶角色卡，讓 6.1 開場完整跑完
  const playerCard = message === NEW_GAME ? "" : currentCard();

  // 常駐記憶檔：每輪帶給角色
  const mem = loadMem();
  const memory = message === NEW_GAME ? "" : buildMemory(mem);

  // 換窗後第一輪（/舊玩家）：全部記憶片段完整附上；之後只在提到時 EVT 回查
  // EVT 回查：這次送出的對話紀錄（最近 40 則）以外的舊事件，提到才附上
  const windowMsgs = prior.slice(-HISTORY_LIMIT);
  const windowStart = Math.min(...windowMsgs.filter((m) => m.role === "model" && m.page).map((m) => m.page), Infinity);
  const lastModel = [...windowMsgs].reverse().find((m) => m.role === "model");
  const recall =
    message === NEW_GAME ? ""
    : isOldGame(message) ? allFragsText(mem)
    : recallText(mem, message, lastModel ? lastModel.text : "", windowStart === Infinity ? 0 : windowStart);

  // 自動寫入記憶庫：玩家送出下一句時，前面的頁數已經確定，滿 SAVE_EVERY 頁就在背景寫入
  const s = curSlot();
  if (message !== NEW_GAME && s && (s.pages || 0) - mem.saved >= SAVE_EVERY) runSave();

  setBusy(true);
  try {
    const data = await callWorker("/chat", {
      key: settings.key,
      model: settings.model,
      character: settings.character,
      playerCard,
      playerName: playerName(),
      memory,
      recall,
      history: prior,
      message,
    });
    if (typeof data.tail === "string" && tailMarks[settings.character] !== data.tail) {
      tailMarks[settings.character] = data.tail;
      store.set("rp_tail", tailMarks);
    }
    history.push({ role: "model", text: data.text, usage: data.usage });
    saveHistory(); // 這一步會把頁首 page.X 校正成程式計數
    setBusy(false);
    renderTitle();
    const last = history[history.length - 1];
    addBubble("model", last.text, true, data.usage, true, last.page);
  } catch (e) {
    setBusy(false);
    addBubble("error", e.message);
  }
}

function autoGrow() {

}

$("newGame").onclick = () => {
  if (!ready()) return;
  const name = (curSlot() || {}).name || "這個存檔";
  if (history.length && !confirm(`開始新遊戲會清除「${name}」目前的對話與記憶庫（角色卡保留），確定嗎？\n\n想保留這段故事，可以到「切換角色」另開新存檔。`)) return;
  history = [];
  saveHistory();
  // 記憶庫一起清空；epoch +1 讓進行中的寫入結果作廢
  const s = curSlot();
  if (s) {
    const old = loadMem();
    saveMem(settings.character, s.id, { saved: 0, epoch: (old.epoch || 0) + 1, frags: [] });
    s.base = 0;
    saveHistory();
    if (sameSlot(saveFail)) saveFail = null;
  }
  render();
  send(NEW_GAME);
};

$("pasteCard").onclick = () => {
  const card = currentCard();
  if (!card) return;
  $("input").value = card;
  autoGrow();
  $("input").focus();
};

$("retry").onclick = () => {
  if (busy || !history.length) return;
  // 移除最後一則角色回覆，用最後一則玩家訊息重新送出
  let dropped = 0;
  if (history[history.length - 1].role === "model") dropped = history.pop().page || 0;
  const lastUser = history[history.length - 1];
  if (!lastUser || lastUser.role !== "user") return;
  history.pop();
  saveHistory();
  // 重來的那頁如果已經寫入記憶庫，含這頁的記憶片段作廢，之後重新寫入
  const s = curSlot();
  if (s && dropped) {
    const mem = loadMem();
    if (dropped <= mem.saved) {
      mem.frags = mem.frags.filter((f) => f.to < dropped);
      mem.saved = mem.frags.length ? mem.frags[mem.frags.length - 1].to : 0;
      mem.epoch = (mem.epoch || 0) + 1;
      saveMem(settings.character, s.id, mem);
    }
  }
  render();
  history.push(lastUser);
  saveHistory();
  addBubble("user", lastUser.text);
  send(lastUser.text, { addUser: false });
};

    const t = document.createElement("textarea");
    t.value = text;
    t.style.position = "fixed";
    t.style.opacity = "0";

  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// 匯出記憶庫：還有沒寫入的頁數就先寫入，寫入失敗不匯出
$("ioExportMem").onclick = async () => {
  const s = curSlot();
  if (!s) { ioStatus("請先到設定選好角色", true); return; }
  if (busy) { ioStatus("角色正在回應，稍等一下再匯出", true); return; }
  if (saving) { ioStatus("記憶庫正在寫入，寫完再匯出", true); return; }
  if ((s.pages || 0) > loadMem().saved) {
    if (!ready()) return;
    ioStatus(`先把 page.${s.pages} 以前寫入記憶庫，請稍等…`);
    const ok = await runSave(false);
    if (!ok || (s.pages || 0) > loadMem().saved) { ioStatus("記憶庫沒有寫入成功，這次先不匯出。可以稍後再試", true); return; }
    $("ioExportSub").textContent = ioSlotInfo();
  }
  const mem = loadMem();
  if (!mem.frags.length) { ioStatus(`記憶庫還是空的，滿 ${SAVE_EVERY} 頁會自動寫入，也可以從 ☰ 按「💾 立即寫入記憶庫」`, true); return; }
  const data = {
    format: MEM_FORMAT,
    version: 1,
    exportedAt: new Date().toISOString(),
    character: { id: settings.character, name: settings.characterName },
    slot: { name: s.name, card: s.card || "", pages: mem.saved },
    memory: { saved: mem.saved, frags: mem.frags },
  };
  download(`${safeName(settings.characterName)}_${safeName(s.name)}_記憶庫_page${mem.saved}_${today()}.json`, JSON.stringify(data, null, 1), "application/json");
  ioStatus("已匯出記憶庫 ✧ 檔案在手機的「下載」資料夾");
};

// 建好新存檔後寫入；空間不夠就整個退回，不留半套資料
function writeNewSlot(cid, s, hist, mem) {
  const ok = store.set(historyKey(cid, s.id), hist) && store.set(memKey(cid, s.id), mem);
  if (ok) return true;
  store.remove(historyKey(cid, s.id));
  store.remove(memKey(cid, s.id));
  const cs = charSlots(cid);
  cs.list = cs.list.filter((x) => x.id !== s.id);
  cs.current = cs.list.length ? cs.list[0].id : "";
  saveSlots();
  return false;
}

// 匯入記憶庫：新增一個存檔，帶著角色卡與記憶庫從下一頁接續（流程同換窗）
$("ioImport").onclick = () => {
  if (busy) { ioStatus("角色正在回應，稍等一下再匯入", true); return; }
  if (!settings.invite || !settings.key || !settings.model) { ioStatus("請先到設定填好邀請碼、API key 與模型", true); return; }
  $("ioFile").value = "";
  $("ioFile").click();
};
$("ioFile").onchange = async () => {
  const f = $("ioFile").files[0];
  if (!f) return;
  ioStatus("讀取中…");
  let data;
  try { data = JSON.parse(await f.text()); } catch { data = null; }
  if (data && data.format === OLD_SAVE_FORMAT) {
    ioStatus("這是舊版的存檔檔案，現在只能匯入記憶庫。請改用「📜 匯出記憶庫」下載的檔案", true);
    return;
  }
  if (!data || data.format !== MEM_FORMAT || !data.character || !data.memory || !Array.isArray(data.memory.frags)) {
    ioStatus("這不是記憶庫檔案。請選擇用「📜 匯出記憶庫」下載的 .json 檔", true);
    return;
  }
  const frags = data.memory.frags
    .filter((x) => x && typeof x.text === "string" && x.text.trim())
    .map((x) => ({ ...x, from: parseInt(x.from, 10) || 1, to: parseInt(x.to, 10) || 0 }));
  if (!frags.length) { ioStatus("這個記憶庫是空的，沒有可以接續的內容", true); return; }

  let chars;
  try { chars = (await callWorker("/characters", {})).characters || []; } catch (e) { ioStatus(e.message, true); return; }
  const c = chars.find((x) => x.id === data.character.id);
  if (!c) { ioStatus(`「${data.character.name || data.character.id}」目前沒有開放，無法匯入`, true); return; }

  const base = Math.max(parseInt(data.memory.saved, 10) || 0, ...frags.map((x) => x.to));
  const slotData = data.slot || {};
  const s = newSlot(c.id, `${String(slotData.name || "存檔").slice(0, 24)}（接續）`);
  s.card = String(slotData.card || "");
  s.base = base;
  if (!writeNewSlot(c.id, s, [], { saved: base, epoch: 0, frags })) { ioStatus("手機瀏覽器的空間不夠，匯入失敗。可以先刪掉不玩的存檔再試", true); return; }
  saveSlots();
  enterSlot(c, s.id);
  $("ioPanel").classList.remove("open");
  toast(`已匯入「${s.name}」，從 page.${base + 1} 接續 ✧`);
  send(`${OLD_GAME}\n${OLD_NOTE}`);
};

// ---------- 🪟 換窗接續 ----------
// 先把沒寫入的頁數寫入記憶庫 → 另開新存檔（同角色卡、同記憶庫、頁碼接續、對話清空）→ 送 /舊玩家 接回劇情；舊窗完整保留
async function newWindow() {
  if (busy) { toast("角色正在回應，稍等一下再換窗"); return; }
  if (!ready()) return;
  const s = curSlot();
  if (!s || !history.length) { toast("這個存檔還沒有內容，不需要換窗"); return; }
  if (saving) { toast("記憶庫正在寫入，寫完再換窗"); return; }

  const n = (s.win || 1) + 1;
  const baseName = s.name.replace(/・第\s*\d+\s*窗$/, "");
  const name = prompt("新窗的名稱", `${baseName}・第 ${n} 窗`);
  if (name === null) return;

  if ((s.pages || 0) > loadMem().saved) {
    toast("先把這一窗寫入記憶庫…");
    const ok = await runSave(false);
    if (!ok || (s.pages || 0) > loadMem().saved) { toast("記憶庫沒有寫入成功，這次先不換窗"); return; }
  }

  const cid = settings.character;
  const mem = loadMem();
  const ns = newSlot(cid, (name.trim() || `${baseName}・第 ${n} 窗`).slice(0, 30));
  ns.card = s.card || "";
  ns.base = s.pages || 0;
  ns.win = n;
  const copy = { saved: ns.base, epoch: 0, frags: JSON.parse(JSON.stringify(mem.frags)) };
  if (!writeNewSlot(cid, ns, [], copy)) { toast("手機瀏覽器的空間不夠，可以先匯出記憶庫備份，再刪掉不玩的存檔"); return; }
  saveSlots();
  $("memoryPanel").classList.remove("open");
  enterSlot({ id: cid, name: settings.characterName }, ns.id);
  toast(`已換到「${ns.name}」，從 page.${ns.base + 1} 接續 ✧`);
  send(`${OLD_GAME}\n${OLD_NOTE}`);
}
$("newWindow").onclick = newWindow;
$("memWindow").onclick = newWindow;

// 從其他平台接續
function lastPageOf(text) {
  let max = 0;
  for (const m of text.matchAll(/Page\.?\s*(\d+)\s*[-–~～]\s*(\d+)/gi)) max = Math.max(max, +m[2]);
  if (!max) for (const m of text.matchAll(/Page\.\s*(\d+)/gi)) max = Math.max(max, +m[1]);
  return max;
}
function ioHint() {
  const t = $("ioMem").value.trim();
  const n = lastPageOf(t);
  $("ioHint").textContent = t ? (n ? `找到 Page.${n}，會從 page.${n + 1} 接著算` : "沒有找到頁碼，會從 page.1 開始") : "";
}
$("ioMem").addEventListener("input", ioHint);

$("ioContinue").onclick = async () => {
  ioShow(true);
  $("ioName").value = "";
  $("ioCard").value = "";
  $("ioMem").value = "";
  ioHint();
  fillSelect($("ioChar"), [], "", "載入中…");
  try {
    const data = await callWorker("/characters", {});
    ioChars = data.characters || [];
    setLore(data.lorebook);
    fillSelect($("ioChar"), ioChars, settings.character, "目前沒有角色");
  } catch (e) {
    ioStatus(e.message, true);
  }
};

$("ioStart").onclick = () => {
  const cid = $("ioChar").value;
  const name = $("ioName").value.trim();
  const card = $("ioCard").value.trim();
  const memText = $("ioMem").value.trim();
  if (!settings.invite || !settings.key || !settings.model) { ioStatus("請先到設定填好邀請碼、API key 與模型", true); return; }
  if (!cid) { ioStatus("請先選擇角色", true); return; }
  if (!name) { ioStatus("請為新存檔取名", true); $("ioName").focus(); return; }
  if (!memText) { ioStatus("請貼上原平台的記憶", true); $("ioMem").focus(); return; }
  const c = ioChars.find((x) => x.id === cid) || { id: cid, name: cid };

  const base = lastPageOf(memText);
  const s = newSlot(cid, name);
  s.card = card;
  s.base = base;
  const mem = { saved: base, epoch: 0, frags: [{ from: 1, to: base, date: today(), text: memText, at: Date.now(), imported: true }] };
  if (!writeNewSlot(cid, s, [], mem)) { ioStatus("手機瀏覽器的空間不夠。可以先刪掉不玩的存檔再試", true); return; }
  saveSlots();
  enterSlot(c, s.id);
  $("ioPanel").classList.remove("open");
  send(`${OLD_GAME}\n${OLD_NOTE}`);
};

// ---------- 切換角色 → 選存檔 ----------
let pickChars = [];

function pickStatus(msg, err = false) {
  $("charStatus").textContent = msg;
  $("charStatus").className = "status" + (err ? " err" : "");
}

function fmtTime(t) {
  if (!t) return "";
  return new Date(t).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}

async function openChars() {
  if (busy) return;
  if (!settings.invite) { openSettings("請先填寫邀請碼"); return; }
  $("charPicker").classList.add("open");
  showCharStep();
  pickStatus("載入角色中…");
  try {
    const data = await callWorker("/characters", {});
    pickChars = data.characters || [];
    setLore(data.lorebook);
    pickStatus(pickChars.length ? "" : "目前沒有角色");
    showCharStep();
  } catch (e) {
    pickStatus(e.message, true);
  }
}

function showCharStep() {
  $("pickTitle").textContent = "切換角色";
  $("pickNote").textContent = "每個角色可以開多個存檔，每個存檔有自己的玩家角色卡與對話。";
  $("slotNew").hidden = true;
  $("backChars").hidden = true;
  const list = $("charList");
  list.innerHTML = "";
  for (const c of pickChars) {
    const b = document.createElement("button");
    b.type = "button";
    if (c.id === settings.character) b.className = "current";
    b.textContent = c.name || c.id;
    if (c.intro) {
      const intro = document.createElement("small");
      intro.className = "intro";
      intro.textContent = c.intro;
      b.append(intro);
    }
    const n = (slots[c.id] && slots[c.id].list.length) || 0;
    const note = document.createElement("small");
    note.textContent = (c.id === settings.character ? "目前角色・" : "") + (n ? `${n} 個存檔` : "尚未開始");
    b.append(note);
    b.onclick = () => showSlotStep(c);
    list.append(b);
  }
}

function showSlotStep(c) {
  const cname = c.name || c.id;
  $("pickTitle").textContent = cname;
  $("pickNote").textContent = "選一個存檔繼續，或新增一個存檔，用另一張玩家角色卡開始新的故事線。";
  $("slotNew").hidden = false;
  $("backChars").hidden = false;
  $("slotName").value = "";
  pickStatus("");
  $("addSlot").onclick = () => {
    const name = $("slotName").value.trim();
    if (!name) { pickStatus("請先為新存檔取名", true); $("slotName").focus(); return; }
    const s = newSlot(c.id, name);
    enterSlot(c, s.id);
  };

  const cs = charSlots(c.id);
  const list = $("charList");
  list.innerHTML = "";
  if (!cs.list.length) pickStatus("這個角色還沒有存檔，先在下方取名新增一個。");
  const active = c.id === settings.character ? cs.current : "";
  for (const s of cs.list) {
    const row = document.createElement("div");
    row.className = "slot";

    const b = document.createElement("button");
    b.type = "button";
    if (s.id === active) b.className = "current";
    b.textContent = s.name;
    const note = document.createElement("small");
    const info = [];
    if (s.id === active) info.push("目前存檔");
    info.push(s.count ? `${slotPages(c.id, s)} 頁` : "尚未開始");
    if (s.count && s.updated) info.push(`最後遊玩 ${fmtTime(s.updated)}`);
    if (!s.card) info.push("未填角色卡");
    note.textContent = info.join("・");
    b.append(note);
    b.onclick = () => enterSlot(c, s.id);

    const ren = document.createElement("button");
    ren.type = "button";
    ren.className = "mini";
    ren.textContent = "改名";
    ren.onclick = () => {
      const v = prompt("新的存檔名稱", s.name);
      if (v === null || !v.trim()) return;
      s.name = v.trim().slice(0, 30);
      saveSlots();
      showSlotStep(c);
      render();
    };

    const del = document.createElement("button");
    del.type = "button";
    del.className = "mini del";
    del.textContent = "刪除";
    del.onclick = () => {
      if (!confirm(`刪除「${s.name}」？這個存檔的對話、角色卡與記憶庫都會清除，無法復原。`)) return;
      store.remove(historyKey(c.id, s.id));
      store.remove(memKey(c.id, s.id));
      cs.list = cs.list.filter((x) => x.id !== s.id);
      if (cs.current === s.id) cs.current = cs.list.length ? cs.list[0].id : "";
      saveSlots();
      if (c.id === settings.character) { loadHistory(); render(); }
      showSlotStep(c);
    };

    row.append(b, ren, del);
    list.append(row);
  }
}

function enterSlot(c, sid) {
  settings.character = c.id;
  settings.characterName = c.name || c.id;
  store.set("rp_settings", settings);
  charSlots(c.id).current = sid;
  saveSlots();
  loadHistory();
  render();
  $("charPicker").classList.remove("open");
}

$("backChars").onclick = showCharStep;
$("slotName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("addSlot").click(); } });

$("openChars").onclick = openChars;
$("title").onclick = openChars;
$("closeChars").onclick = () => $("charPicker").classList.remove("open");
$("closeSettings").onclick = () => $("settings").classList.remove("open");

$("toggleKey").onclick = () => {
  const i = $("apikey");
  i.type = i.type === "password" ? "text" : "password";
  $("toggleKey").textContent = i.type === "password" ? "顯示" : "隱藏";
};

// 服務商與 key 開頭不符時提醒；貼上 key 時自動切換服務商
const KEY_TIP = "貼上 key 會自動判斷服務商：AIza＝Gemini、sk-ant-＝Claude、sk-or-＝OpenRouter；其他 sk- 開頭是 ChatGPT 或 DeepSeek，請自己選";
function keyMismatch() {
  const d = detectProvider($("apikey").value);
  if (keyFits($("apikey").value, $("provider").value)) return "";
  return d === "sk" ? "這把 key 是 sk- 開頭，服務商請選 ChatGPT 或 DeepSeek" : `這把 key 看起來是 ${PROVIDERS[d]} 的，服務商請選 ${PROVIDERS[d]}`;
}
function keyHint() {
  const d = detectProvider($("apikey").value);
  const bad = keyMismatch();
  let tip = KEY_TIP;
  if (!bad && d === "sk") tip = `sk- 開頭的 key 可能是 ChatGPT 或 DeepSeek，目前選的是 ${PROVIDERS[$("provider").value]}，不對請改選`;
  $("keyHint").textContent = bad || tip;
  $("keyHint").className = "status" + (bad ? " err" : "");
}
// 換服務商：模型清單不通用，清空等重新載入
function resetModels() {
  fillSelect($("model"), [], "", "先按「載入」");
}
$("apikey").addEventListener("input", () => {
  const d = detectProvider($("apikey").value);
  if (!keyFits($("apikey").value, $("provider").value)) { $("provider").value = d === "sk" ? "openai" : d; resetModels(); }
  keyHint();
});
$("provider").addEventListener("change", () => { resetModels(); keyHint(); });

$("loadModels").onclick = async () => {
  settings.invite = $("invite").value.trim();
  const key = $("apikey").value.trim();
  status("載入模型中…");
  try {
    const data = await callWorker("/models", { key, provider: $("provider").value });
    fillSelect($("model"), data.models, settings.model, "沒有可用的模型");
    status(data.models.length ? `找到 ${data.models.length} 個可用模型` : "這把 key 沒有可用的模型", !data.models.length);
  } catch (e) { status(e.message, true); }
};

$("loadChars").onclick = async () => {
  settings.invite = $("invite").value.trim();
  status("載入角色中…");
  try {
    const data = await callWorker("/characters", {});
    fillSelect($("character"), data.characters, settings.character, "目前沒有角色");
    setLore(data.lorebook);
    $("card").value = (slotOf($("character").value) || {}).card || "";
    status(data.characters.length ? "角色已載入" : "目前沒有角色", !data.characters.length);
  } catch (e) { status(e.message, true); }
};

// 在設定裡切換角色時，角色卡欄位換成那個角色目前存檔的卡
$("character").addEventListener("change", () => {
  $("card").value = (slotOf($("character").value) || {}).card || "";
});

$("saveSettings").onclick = () => {
  const charSel = $("character");
  const prevChar = settings.character;
  const bad = keyMismatch();
  if (bad) { keyHint(); status(bad, true); return; }
  settings = {
    invite: $("invite").value.trim(),
    key: $("apikey").value.trim(),
    provider: $("provider").value,
    model: $("model").value,
    character: charSel.value,
    characterName: charSel.value ? charSel.options[charSel.selectedIndex].textContent : "",
  };
  store.set("rp_settings", settings);
  ensureSlot(settings.character);
  setCard($("card").value.trim());
  if (settings.character !== prevChar) loadHistory();
  $("settings").classList.remove("open");
  render();
};

// ---------- 外觀 ----------
function applyTheme(t) {
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelector('meta[name="theme-color"]').setAttribute("content", bg || "#17131d");
}
$("theme").value = store.get("rp_theme", "auto");
$("theme").addEventListener("change", () => {
  store.set("rp_theme", $("theme").value);
  applyTheme($("theme").value);
});
applyTheme($("theme").value);
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => applyTheme(store.get("rp_theme", "auto")));
}

// ---------- ☰ 選單 ----------
$("linkChars").href = CHARS_URL;
$("linkWorlds").href = WORLDS_URL;
$("linkGuide").href = GUIDE_URL;

function setMenu(open) {
  $("menu").classList.toggle("open", open);
  $("menuBtn").setAttribute("aria-expanded", open ? "true" : "false");
}
$("menuBtn").onclick = (e) => { e.stopPropagation(); setMenu(!$("menu").classList.contains("open")); };
// 點選單外面關閉；點任何一項後也關閉（項目本身的動作照常執行）
$("menu").addEventListener("click", (e) => {
  if (e.target === $("menu") || e.target.closest(".menu a, .menu button")) setMenu(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

// ---------- 啟動 ----------
if (settings.character) ensureSlot(settings.character);
loadHistory();
render();
if (!settings.key || !settings.invite) openSettings();

// 背景更新翻看清單（作者新增或修改條目時，玩家不用重新設定）
if (settings.invite) {
  callWorker("/characters", {})
    .then((d) => {
      const before = JSON.stringify(lorebook);
      setLore(d.lorebook);
      if (JSON.stringify(lorebook) !== before && !busy) render();
    })
    .catch(() => {});
}

// 要求瀏覽器盡量不要自動清除這個網站的資料
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
